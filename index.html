<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>綠能方程式 - 大螢幕主控端</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>

  <!-- 設定 Firebase 的 Import Map -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js"
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&family=Anton&family=Space+Mono:wght@400;700&family=Righteous&display=swap');
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Noto Sans TC', sans-serif; }
    .retro-title {
      text-shadow: 4px 4px 0px #e11d48, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    }
    .retro-subtitle {
      text-shadow: 3px 3px 0px #1d4ed8, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    }
    .bg-checkerboard {
      background-image:
        linear-gradient(45deg, #1f2937 25%, transparent 25%),
        linear-gradient(-45deg, #1f2937 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1f2937 75%),
        linear-gradient(-45deg, transparent 75%, #1f2937 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    /* 背景：低對比藍色賽車格紋 */
    .bg-grid {
      background-color: #1e3a8a;
      background-image: conic-gradient(rgba(255,255,255,0.06) 25%, transparent 0 50%, rgba(255,255,255,0.06) 0 75%, transparent 0);
      background-size: 112px 112px;
    }
    /* ===== 標題字：簡單白色黑體 ===== */
    .logo-plain { font-family: 'Noto Serif TC', 'Noto Sans TC', serif; font-weight: 900; font-style: normal; color: #fff; letter-spacing: 0.02em; line-height: 1.05; display: inline-block; }
    /* ===== 首頁字體系統：襯線粗黑標題 × 窄體英文 × 等寬資訊字 ===== */
    .font-latin { font-family: 'Anton', 'Noto Sans TC', sans-serif; font-weight: 400; letter-spacing: 0.06em; }
    .font-hud { font-family: 'Space Mono', ui-monospace, monospace; }
    .outline-num { font-family: 'Anton', sans-serif; color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,0.13); line-height: 0.8; letter-spacing: 0.02em; }
    .track-dash { background-image: linear-gradient(90deg, rgba(255,255,255,0.55) 50%, transparent 50%); background-size: 28px 4px; background-repeat: repeat-x; height: 4px; }
    .qr-box svg { width: 100%; height: 100%; display: block; }
    @keyframes countPop { 0% { transform: scale(1.8); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: scale(0.85); opacity: 0; } }
    .count-pop { animation: countPop 1s ease-out forwards; }
    .bulb-on-red { background: #ef4444; box-shadow: 0 0 10px 2px #ef4444; }
    .bulb-on-yellow { background: #facc15; box-shadow: 0 0 10px 2px #facc15; }
    .bulb-on-green { background: #22c55e; box-shadow: 0 0 10px 2px #22c55e; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
    import { getDatabase, ref, get, set, update, onValue, runTransaction, onDisconnect, serverTimestamp } from 'firebase/database';

    const { useState, useEffect, useMemo, useRef, useLayoutEffect } = React;

    // ================= 遊戲設定 =================
    const TOTAL_TABLES = 60;     // 桌號 01～60
    const MAX_TEAMS = 10;        // 每場最多參賽組數
    const MIN_TEAMS = 2;         // 每場最少參賽組數
    const RACED_STORAGE_KEY = 'tsrc_raced_tables'; // 本機瀏覽器記錄：已比過賽的桌號
    const TARGET_SCORE = 500;    // 任一組先到此分數，比賽立即結束
    const RACE_DURATION = 30;    // 比賽秒數
    const COUNTDOWN_MS = 3000;   // 3、2、1 倒數；之後顯示 GO 並正式開賽
    const FINISH_GRACE_MS = 1200;  // 時間到後，等手機最後一次回傳分數的緩衝
    const TEAM_SCORE_SYNC_MS = 250; // 主控端把各組總分同步給手機的頻率
    const HOST_STORAGE_KEY = 'tsrc_host_room';

    // 賽車可選顏色（手機端與主控端必須一致）
    const CAR_COLORS = [
      { id: 'red',    hex: '#e11d48', name: '賽道紅' },
      { id: 'blue',   hex: '#3b82f6', name: '極速藍' },
      { id: 'green',  hex: '#22c55e', name: '綠能綠' },
      { id: 'yellow', hex: '#facc15', name: '閃電黃' },
      { id: 'pink',   hex: '#f472b6', name: '霓虹粉' },
      { id: 'orange', hex: '#f97316', name: '烈焰橘' },
      { id: 'purple', hex: '#a855f7', name: '電光紫' },
      { id: 'cyan',   hex: '#38bdf8', name: '天際藍' },
      { id: 'lime',   hex: '#a3e635', name: '萊姆綠' },
      { id: 'black',  hex: '#334155', name: '碳纖黑' },
    ];

    // ================= Firebase =================
    const firebaseConfig = {
      apiKey: "AIzaSyAVKXL-r-MM2NSs9f6T9LPX70b-CAgCXQY",
      authDomain: "tsrc-racing.firebaseapp.com",
      // 注意：請到 Firebase 主控台 → Realtime Database 複製實際網址貼在這裡
      databaseURL: "https://tsrc-racing-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tsrc-racing",
      storageBucket: "tsrc-racing.firebasestorage.app",
      messagingSenderId: "859095220602",
      appId: "1:859095220602:web:70c4d9be106383a97656c3",
      measurementId: "G-1RLXCDE731"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // ================= 工具 =================
    const pad2 = (n) => String(n).padStart(2, '0');
    const teamKey = (t) => `t${t}`;   // 用 t07 這種鍵，避免 RTDB 把數字鍵轉成陣列
    const colorHex = (id) => (CAR_COLORS.find(c => c.id === id) || CAR_COLORS[1]).hex;
    const store = {
      get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
      del: (k) => { try { localStorage.removeItem(k); } catch (e) {} },
    };
    // 已比過賽的桌號（存在這台電腦的瀏覽器）
    const loadRaced = () => {
      try { const v = JSON.parse(localStorage.getItem(RACED_STORAGE_KEY) || '[]'); return Array.isArray(v) ? v.filter(n => Number.isInteger(n)) : []; }
      catch (e) { return []; }
    };
    const saveRaced = (list) => store.set(RACED_STORAGE_KEY, JSON.stringify([...new Set(list)].sort((a, b) => a - b)));

    // 燈號：紅＝無人、黃＝有人未全員準備、綠＝在線玩家全部準備
    const teamStatus = (room, t) => {
      const players = Object.values(room?.players?.[teamKey(t)] || {}).filter(p => p && p.online);
      if (!players.length) return { light: 'red', count: 0, ready: 0 };
      const ready = players.filter(p => p.ready).length;
      return { light: ready === players.length ? 'green' : 'yellow', count: players.length, ready };
    };
    // 組長判定（與手機端相同邏輯）
    const resolveLeader = (members, currentUid) => {
      const online = Object.entries(members || {}).filter(([, p]) => p && p.online);
      if (currentUid && online.some(([id]) => id === currentUid)) return currentUid;
      online.sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0) || (a[0] < b[0] ? -1 : 1));
      return online.length ? online[0][0] : null;
    };
    // 各組總分 = 組內每位玩家分數加總（玩家只能寫自己的分數）
    const teamSums = (room) => {
      const sums = {};
      (room?.tables || []).forEach(t => {
        sums[t] = Object.values(room?.scores?.[teamKey(t)] || {}).reduce((a, p) => a + (Number(p?.s) || 0), 0);
      });
      return sums;
    };
    // 排名：分數高者在前；同分同名次，桌號小的排前面
    const rankTeams = (tables, sums) => {
      const list = [...tables].map(t => ({ table: t, score: sums[t] || 0 })).sort((a, b) => b.score - a.score || a.table - b.table);
      list.forEach((r, i) => { r.rank = i > 0 && r.score === list[i - 1].score ? list[i - 1].rank : i + 1; });
      return list;
    };
    const raceWindow = (meta) => {
      if (!meta?.countdownAt) return null;
      const start = meta.countdownAt + COUNTDOWN_MS;
      return { countdownAt: meta.countdownAt, start, end: start + RACE_DURATION * 1000 };
    };
    const END_REASON_TEXT = { target: `率先達到 ${TARGET_SCORE} 分`, timeout: `${RACE_DURATION} 秒時間到`, aborted: '工作人員緊急中止' };

    const playerUrl = (code) => {
      const u = new URL('mobile.html', location.href);
      u.search = `?room=${code}`;
      return u.toString();
    };

    // ================= UI 元件 =================
    const F1CarSVG = ({ color = '#3b82f6' }) => (
      <svg viewBox="0 0 120 45" className="w-full h-full drop-shadow-md">
        <g stroke="#000" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round">
          <path d="M10,35 L110,35 L115,25 L105,25 Z" fill="#1e3a8a" />
          <path d="M5,15 L25,15 L25,25 L5,25 Z" fill="#e11d48" />
          <path d="M10,5 L15,5 L15,35 L10,35 Z" fill="#000" />
          <path d="M25,25 L45,15 L75,15 L100,25 Z" fill={color} />
          <path d="M55,15 C55,5 70,5 70,15 Z" fill="#fff" />
          <path d="M40,25 L65,25 L65,30 L40,30 Z" fill="#22c55e" />
          <path d="M105,30 L115,30 L115,35 L105,35 Z" fill="#e11d48" />
          <circle cx="25" cy="30" r="12" fill="#1f2937" />
          <circle cx="25" cy="30" r="6" fill="#facc15" />
          <circle cx="25" cy="30" r="2" fill="#000" />
          <circle cx="90" cy="30" r="12" fill="#1f2937" />
          <circle cx="90" cy="30" r="6" fill="#facc15" />
          <circle cx="90" cy="30" r="2" fill="#000" />
          <circle cx="50" cy="20" r="6" fill="#fff" />
        </g>
      </svg>
    );

    const TrophyIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-[#e11d48] drop-shadow-[4px_4px_0px_#000]">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
    );

    const TrafficLight = ({ light }) => (
      <div className="flex gap-1 bg-black border-2 border-black rounded-full px-1.5 py-1 shrink-0" title={light}>
        {['red', 'yellow', 'green'].map(c => (
          <div key={c} className={`w-4 h-4 rounded-full border border-black ${light === c ? `bulb-on-${c}` : 'bg-gray-600'}`}></div>
        ))}
      </div>
    );

    const QRCodeBox = ({ text }) => {
      const svg = useMemo(() => {
        if (typeof qrcode === 'undefined') return '';
        const q = qrcode(0, 'M');
        q.addData(text);
        q.make();
        return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
      }, [text]);
      return <div className="qr-box bg-white border-4 border-black p-1 shadow-[6px_6px_0px_#000] w-56 h-56" dangerouslySetInnerHTML={{ __html: svg }} />;
    };

    // 需要按兩次才會執行的按鈕（避免誤觸，也不使用瀏覽器跳窗）
    const ConfirmButton = ({ onConfirm, children, confirmText, className }) => {
      const [armed, setArmed] = useState(false);
      useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 3000); return () => clearTimeout(t); }, [armed]);
      return (
        <button onClick={() => (armed ? (setArmed(false), onConfirm()) : setArmed(true))} className={`${className} ${armed ? '!bg-[#e11d48] !text-white' : ''}`}>
          {armed ? confirmText : children}
        </button>
      );
    };

    const RetroWindow = ({ title, right, children, className = '' }) => (
      <div className={`w-full bg-white border-4 border-black rounded-xl shadow-[12px_12px_0px_#000] overflow-hidden z-10 flex flex-col ${className}`}>
        <div className="bg-[#f1f5f9] border-b-4 border-black p-3 flex justify-between items-center">
          <div className="flex items-center gap-4">
            <div className="flex gap-2">
              <div className="w-5 h-5 rounded-full bg-[#e11d48] border-2 border-black"></div>
              <div className="w-5 h-5 rounded-full bg-[#facc15] border-2 border-black"></div>
              <div className="w-5 h-5 rounded-full bg-[#22c55e] border-2 border-black"></div>
            </div>
            <span className="font-black text-black text-xl tracking-wider uppercase font-['Righteous']">{title}</span>
          </div>
          {right}
        </div>
        {children}
      </div>
    );

    // 標題字元件：簡單白色黑體，無任何特效
    const LogoText = ({ children }) => <span className="logo-plain">{children}</span>;

    // 畫面自動縮放：內容依固定設計寬度排版，再等比縮放到剛好放進視窗（電腦端永遠不需要捲動）
    const FitStage = ({ width, children }) => {
      const outer = useRef(null);
      const inner = useRef(null);
      const [scale, setScale] = useState(1);
      useLayoutEffect(() => {
        const fit = () => {
          const o = outer.current, i = inner.current;
          if (!o || !i || !i.offsetWidth || !i.offsetHeight) return;
          const s = Math.min(1.35, (o.clientWidth - 48) / i.offsetWidth, (o.clientHeight - 48) / i.offsetHeight);
          setScale(s > 0 ? s : 1);
        };
        fit();
        const ro = new ResizeObserver(fit);
        ro.observe(outer.current); ro.observe(inner.current);
        window.addEventListener('resize', fit);
        return () => { ro.disconnect(); window.removeEventListener('resize', fit); };
      }, []);
      return (
        <div ref={outer} className="absolute inset-0 flex items-center justify-center overflow-hidden">
          <div ref={inner} className="flex flex-col items-center shrink-0" style={{ width, transform: `scale(${scale})`, transformOrigin: 'center center' }}>
            {children}
          </div>
        </div>
      );
    };

    const TitleBlock = ({ big }) => (
      <div className="text-center mb-8 z-10 flex flex-col items-center">
        <div className={`flex items-center gap-4 mb-4 text-white ${big ? 'text-3xl' : 'text-2xl'}`}>
          <span className="inline-block h-[3px] w-[3em] bg-[#facc15]"></span>
          <span className="font-medium tracking-[0.2em]">解鎖你的 2027 冠軍賽道</span>
        </div>
        <h1 className={big ? 'text-[128px]' : 'text-[72px]'}><LogoText>綠能方程式</LogoText></h1>
      </div>
    );

    const bigBtn = (enabled) => `px-10 py-4 rounded-full border-4 border-black font-black text-2xl tracking-widest flex items-center gap-4 transition-all ${enabled ? 'bg-[#e11d48] text-white shadow-[6px_6px_0px_#000] hover:bg-[#be123c] active:shadow-[0px_0px_0px_#000] active:translate-y-[6px]' : 'bg-gray-400 text-gray-700 cursor-not-allowed shadow-[0px_0px_0px_#000] translate-y-[6px]'}`;
    const ghostBtn = 'px-6 py-3 bg-white text-black border-4 border-black font-black text-lg shadow-[4px_4px_0px_#000] active:translate-y-[4px] active:shadow-none transition-all';

    // ================= 主程式 =================
    const App = () => {
      const [user, setUser] = useState(null);
      const [connected, setConnected] = useState(false);
      const [view, setView] = useState('loading'); // loading | home | setup | room
      const [selected, setSelected] = useState([]);
      const [raced, setRaced] = useState(loadRaced);
      const [unmarkArmed, setUnmarkArmed] = useState(null); // 準備解除註記的桌號
      const [roomCode, setRoomCode] = useState(null);
      const [room, setRoom] = useState(null);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');
      const [now, setNow] = useState(Date.now());      // 伺服器時間（比賽中每 0.1 秒更新）
      const offsetRef = useRef(0);                      // 本機與 Firebase 伺服器的時間差
      const sumsRef = useRef({});
      const refereeRef = useRef({ racingFor: null, finishedFor: null });
      const lastSyncRef = useRef('');

      // 1. 匿名登入 + 連線狀態
      useEffect(() => {
        signInAnonymously(auth).catch(err => { console.error(err); setError('Firebase 登入失敗，請確認網路與匿名登入設定'); });
        const unAuth = onAuthStateChanged(auth, setUser);
        const unConn = onValue(ref(db, '.info/connected'), s => setConnected(s.val() === true));
        return () => { unAuth(); unConn(); };
      }, []);

      // 2. 重新整理時，接回自己建立且尚未關閉的房間
      useEffect(() => {
        if (!user) return;
        const saved = store.get(HOST_STORAGE_KEY);
        if (!saved) { setView('home'); return; }
        get(ref(db, `rooms/${saved}/meta`)).then(s => {
          const m = s.val();
          if (m && m.hostUid === user.uid && m.status !== 'closed') { setRoomCode(saved); setView('room'); }
          else { store.del(HOST_STORAGE_KEY); setView('home'); }
        }).catch(() => setView('home'));
      }, [user]);

      // 3. 監聽房間資料 + 主控端在線狀態（斷線時自動標記離線，重連後恢復）
      useEffect(() => {
        if (!roomCode) { setRoom(null); return; }
        const unRoom = onValue(ref(db, `rooms/${roomCode}`), s => setRoom(s.val()), err => console.error(err));
        const onlineRef = ref(db, `rooms/${roomCode}/meta/hostOnline`);
        const unConn = onValue(ref(db, '.info/connected'), s => {
          if (s.val() !== true) return;
          onDisconnect(onlineRef).set(false).then(() => set(onlineRef, true)).catch(console.error);
        });
        return () => { unRoom(); unConn(); };
      }, [roomCode]);

      // 房間被刪除時回首頁
      useEffect(() => {
        if (view === 'room' && roomCode && room === null) {
          const t = setTimeout(() => { get(ref(db, `rooms/${roomCode}/meta`)).then(s => { if (!s.exists()) leaveRoom(); }); }, 1500);
          return () => clearTimeout(t);
        }
      }, [room, view, roomCode]);

      // 組長備援 + 顏色防撞：準備階段由主控端確保每組組長正確、各組顏色不重複
      useEffect(() => {
        if (!room || !roomCode || room.meta?.status !== 'lobby') return;
        const updates = {};
        const used = new Set();
        (room.tables || []).forEach(t => {
          const key = teamKey(t);
          const current = room.teams?.[key]?.leaderUid || null;
          const desired = resolveLeader(room.players?.[key], current);
          if (desired !== current) updates[`teams/${key}/leaderUid`] = desired;
          let color = room.teams?.[key]?.color;
          if (!color || used.has(color)) {
            const free = CAR_COLORS.find(c => !used.has(c.id) && !(room.tables || []).some(o => o !== t && room.teams?.[teamKey(o)]?.color === c.id));
            if (free) { color = free.id; updates[`teams/${key}/color`] = color; }
          }
          used.add(color);
        });
        if (Object.keys(updates).length) update(ref(db, `rooms/${roomCode}`), updates).catch(console.error);
      }, [room, roomCode]);

      // ===== 比賽控制（主控端擔任裁判）=====
      const status = room?.meta?.status || 'lobby';
      const win = raceWindow(room?.meta);
      const sums = useMemo(() => teamSums(room), [room]);
      sumsRef.current = sums;

      // 伺服器時間差：所有裝置用同一個時鐘計算倒數
      useEffect(() => onValue(ref(db, '.info/serverTimeOffset'), s => { offsetRef.current = Number(s.val()) || 0; }), []);

      const finishRace = (reason) => {
        if (!room || !win || refereeRef.current.finishedFor === win.countdownAt) return;
        refereeRef.current.finishedFor = win.countdownAt;
        const ranking = rankTeams(room.tables || [], sumsRef.current);
        const teamScores = {};
        ranking.forEach(r => { teamScores[teamKey(r.table)] = r.score; });
        update(ref(db, `rooms/${roomCode}`), {
          'meta/status': 'finished', 'meta/endReason': reason, 'meta/finishedAt': serverTimestamp(),
          teamScores, result: { reason, ranking },
        }).catch(err => { console.error(err); refereeRef.current.finishedFor = null; });
      };

      // 計時與結束判斷：倒數結束 → 正式開賽；任一組達 500 分或 30 秒到 → 結束
      useEffect(() => {
        if (!win || !['countdown', 'racing'].includes(status)) return;
        const tick = () => {
          const t = Date.now() + offsetRef.current;
          setNow(t);
          if (status === 'countdown' && t >= win.start && refereeRef.current.racingFor !== win.countdownAt) {
            refereeRef.current.racingFor = win.countdownAt;
            update(ref(db, `rooms/${roomCode}/meta`), { status: 'racing' }).catch(err => { console.error(err); refereeRef.current.racingFor = null; });
          }
          if (status === 'racing') {
            if (Object.values(sumsRef.current).some(v => v >= TARGET_SCORE)) finishRace('target');
            else if (t >= win.end + FINISH_GRACE_MS) finishRace('timeout');
          }
        };
        tick();
        const id = setInterval(tick, 100);
        return () => clearInterval(id);
      }, [status, win?.countdownAt, roomCode]);

      // 有組別達標時立即結束（不用等下一次計時）
      useEffect(() => {
        if (status === 'racing' && Object.values(sums).some(v => v >= TARGET_SCORE)) finishRace('target');
      }, [sums, status]);

      // 比賽中把各組總分同步給手機（節流）
      useEffect(() => {
        if (status !== 'racing' || !roomCode) return;
        const id = setInterval(() => {
          const payload = {};
          Object.entries(sumsRef.current).forEach(([t, v]) => { payload[teamKey(t)] = v; });
          const key = JSON.stringify(payload);
          if (key === lastSyncRef.current) return;
          lastSyncRef.current = key;
          set(ref(db, `rooms/${roomCode}/teamScores`), payload).catch(console.error);
        }, TEAM_SCORE_SYNC_MS);
        return () => clearInterval(id);
      }, [status, roomCode]);

      const allGreen = !!room?.tables?.length && room.tables.every(t => teamStatus(room, t).light === 'green');

      const startRace = () => {
        if (!room || status !== 'lobby' || !allGreen) return;
        lastSyncRef.current = '';
        update(ref(db, `rooms/${roomCode}`), {
          'meta/status': 'countdown', 'meta/countdownAt': serverTimestamp(), 'meta/endReason': null, 'meta/finishedAt': null,
          scores: null, teamScores: null, result: null,
        }).catch(err => { console.error(err); setError('開始失敗，請檢查網路'); });
      };

      // 緊急中止：立即停止比賽並保留當下分數
      const abortRace = () => {
        if (!room || !['countdown', 'racing'].includes(status)) return;
        refereeRef.current.finishedFor = win?.countdownAt ?? 'aborted';
        const ranking = rankTeams(room.tables || [], sumsRef.current);
        update(ref(db, `rooms/${roomCode}`), {
          'meta/status': 'aborted', 'meta/endReason': 'aborted', 'meta/finishedAt': serverTimestamp(),
          result: { reason: 'aborted', ranking },
        }).catch(console.error);
      };

      // 重置本場：同一批車隊回到準備狀態（全員需重新確認準備）
      const resetRace = () => {
        if (!room) return;
        const updates = {
          'meta/status': 'lobby', 'meta/countdownAt': null, 'meta/endReason': null, 'meta/finishedAt': null,
          scores: null, teamScores: null, result: null,
        };
        Object.entries(room.players || {}).forEach(([k, members]) => {
          Object.keys(members || {}).forEach(id => { updates[`players/${k}/${id}/ready`] = false; });
        });
        refereeRef.current = { racingFor: null, finishedFor: null };
        update(ref(db, `rooms/${roomCode}`), updates).catch(console.error);
      };

      // 比賽正式開始（進入倒數）後，把本場桌號記錄為「已比賽」
      const roomStatus = room?.meta?.status;
      useEffect(() => {
        if (!room?.tables || !['countdown', 'racing', 'finished'].includes(roomStatus)) return;
        setRaced(prev => {
          const next = [...new Set([...prev, ...room.tables])].sort((a, b) => a - b);
          if (next.length === prev.length) return prev;
          saveRaced(next);
          return next;
        });
      }, [roomStatus, room?.tables]);

      useEffect(() => {
        if (unmarkArmed === null) return;
        const t = setTimeout(() => setUnmarkArmed(null), 3000);
        return () => clearTimeout(t);
      }, [unmarkArmed]);

      const toggleTable = (t) => {
        setError('');
        if (raced.includes(t)) {
          // 已比賽的桌號：按兩次可解除註記（例如比賽中途緊急中止要重賽）
          if (unmarkArmed === t) {
            const next = raced.filter(x => x !== t);
            setRaced(next); saveRaced(next); setUnmarkArmed(null);
          } else setUnmarkArmed(t);
          return;
        }
        setSelected(prev => prev.includes(t) ? prev.filter(x => x !== t) : prev.length >= MAX_TEAMS ? prev : [...prev, t]);
      };

      const resetRaced = () => { setRaced([]); saveRaced([]); setUnmarkArmed(null); };
      const canCreate = selected.length >= MIN_TEAMS && selected.length <= MAX_TEAMS;

      // 建立房間：隨機 6 碼，用 transaction 確保不與既有房間重複
      const createRoom = async () => {
        if (!canCreate || !user || busy) return;
        setBusy(true); setError('');
        try {
          const tables = [...new Set(selected)].filter(t => !raced.includes(t)).sort((a, b) => a - b);
          if (tables.length !== selected.length) throw new Error('桌號重複或已比賽過');
          if (tables.length < MIN_TEAMS || tables.length > MAX_TEAMS) throw new Error(`請選擇 ${MIN_TEAMS}～${MAX_TEAMS} 組`);
          const teams = {};
          tables.forEach((t, i) => { teams[teamKey(t)] = { color: CAR_COLORS[i % CAR_COLORS.length].id }; });
          let code = null;
          for (let i = 0; i < 20 && !code; i++) {
            const candidate = String(100000 + Math.floor(Math.random() * 900000));
            const data = { meta: { hostUid: user.uid, createdAt: Date.now(), status: 'lobby' }, tables, teams };
            const res = await runTransaction(ref(db, `rooms/${candidate}`), cur => (cur === null ? data : undefined));
            if (res.committed) code = candidate;
          }
          if (!code) throw new Error('無法產生房間編號，請再試一次');
          store.set(HOST_STORAGE_KEY, code);
          setRoomCode(code);
          setView('room');
        } catch (err) {
          console.error(err);
          setError(`建立房間失敗：${err.message || err}`);
        } finally {
          setBusy(false);
        }
      };

      const leaveRoom = () => {
        store.del(HOST_STORAGE_KEY);
        setRoomCode(null);
        setRoom(null);
        setSelected([]);
        setView('home');
      };

      // 緊急中止／取消房間：標記為關閉，手機端會自動退出
      const closeRoom = async () => {
        try { await update(ref(db, `rooms/${roomCode}/meta`), { status: 'closed', closedAt: Date.now() }); }
        catch (err) { console.error(err); }
        leaveRoom();
      };

      const serverBadge = (
        <div className="flex items-center gap-2 px-3 py-1 bg-black text-white text-sm font-bold font-mono rounded">
          <span className={`animate-pulse ${connected ? 'text-green-400' : 'text-red-400'}`}>●</span> SERVER {connected ? 'ONLINE' : 'RECONNECTING...'}
        </div>
      );

      return (
        <div className="h-screen w-screen bg-[#1e3a8a] bg-grid flex flex-col items-center justify-center relative overflow-hidden">
          {error && (
            <div className="absolute top-4 left-1/2 -translate-x-1/2 z-50 bg-[#e11d48] text-white font-black px-4 py-2 border-4 border-black shadow-[4px_4px_0px_#000]">{error}</div>
          )}

          {view === 'loading' && <TitleBlock big />}

          {/* ===== 遊戲首頁（海報式排版）===== */}
          {view === 'home' && (
            <div className="absolute inset-0 flex flex-col z-10 text-white">
              {/* 上方資訊列 */}
              <div className="flex items-center justify-between px-[4vw] pt-[4vh] font-hud font-bold tracking-[0.3em]" style={{ fontSize: 'clamp(12px, min(1vw, 1.8vh), 20px)' }}>
                <div className="flex items-center gap-3"><span className="inline-block w-3 h-3 bg-[#e11d48] border-2 border-black"></span>TSRC RACING</div>
                <div className="text-white/60">SEASON 2027</div>
                <div className="tracking-normal">{serverBadge}</div>
              </div>

              {/* 主視覺 */}
              <div className="flex-1 grid grid-cols-[1.1fr_1fr] items-center gap-[3vw] px-[6vw]">
                <div className="flex flex-col items-start">
                  <div className="flex items-center gap-4 mb-[2.5vh]" style={{ fontSize: 'clamp(16px, min(1.6vw, 3vh), 34px)' }}>
                    <span className="inline-block h-[3px] w-[3em] bg-[#facc15]"></span>
                    <span className="font-medium tracking-[0.2em]">解鎖你的 2027 冠軍賽道</span>
                  </div>
                  <h1 style={{ fontSize: 'clamp(84px, min(10.5vw, 19vh), 230px)' }}><LogoText>綠能<br />方程式</LogoText></h1>
                  <div className="font-latin text-[#facc15] mt-[2vh]" style={{ fontSize: 'clamp(22px, min(2.4vw, 4.4vh), 52px)' }}>GREEN ENERGY FORMULA</div>
                  <button onClick={() => { setSelected([]); setView('setup'); }} disabled={!user}
                    className={`${bigBtn(!!user)} !gap-[0.6em] mt-[5vh]`} style={{ fontSize: 'clamp(22px, min(2.2vw, 4.2vh), 48px)', padding: '0.45em 1.4em', borderWidth: 'clamp(4px, 0.35vw, 7px)' }}>
                    <span>◀</span> 開始遊戲 <span>▶</span>
                  </button>
                </div>

                <div className="relative flex flex-col items-center justify-center">
                  <div className="outline-num absolute select-none pointer-events-none" style={{ fontSize: 'clamp(160px, min(21vw, 38vh), 460px)' }}>2027</div>
                  <div className="relative w-full" style={{ maxWidth: 'min(40vw, 72vh)' }}>
                    <div className="w-full aspect-[120/45]"><F1CarSVG /></div>
                    <div className="mt-[2vh] flex items-center gap-3 font-hud text-white/70 font-bold tracking-[0.25em]" style={{ fontSize: 'clamp(11px, min(0.9vw, 1.7vh), 18px)' }}>
                      <span>START</span>
                      <div className="flex-1 track-dash"></div>
                      <span>FINISH</span>
                      <div className="w-8 h-8 bg-white bg-checkerboard border-2 border-black shrink-0"></div>
                    </div>
                  </div>
                </div>
              </div>

              {/* 下方流程 */}
              <div className="mx-[4vw] mb-[4vh] grid grid-cols-3 border-t-2 border-white/30" style={{ fontSize: 'clamp(13px, min(1.1vw, 2vh), 24px)' }}>
                {[['01', '選擇參賽桌號'], ['02', '手機掃碼加入'], ['03', '30 秒極速對決']].map(([n, t], i) => (
                  <div key={n} className={`flex items-baseline gap-4 pt-[2vh] ${i ? 'pl-[2vw] border-l-2 border-white/30' : ''}`}>
                    <span className="font-hud font-bold text-[#facc15]">{n}</span>
                    <span className="font-medium tracking-[0.15em] text-white/90">{t}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ===== 賽事設定：選 2～10 組桌號 ===== */}
          {view === 'setup' && (
            <FitStage width={1240}>
              <TitleBlock />
              <RetroWindow title="Race_Setup.exe" right={serverBadge} className="max-w-6xl">
                <div className="bg-[#facc15] border-b-4 border-black px-5 py-3 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <span className="font-black text-black text-2xl">請選擇參賽桌號</span>
                    <span className="ml-3 font-bold text-black text-base">（{MIN_TEAMS}～{MAX_TEAMS} 組，打叉為已比賽）</span>
                  </div>
                  <span className={`px-4 py-1 border-4 border-black font-black text-2xl font-mono ${canCreate ? 'bg-[#22c55e] text-black' : 'bg-black text-[#facc15]'}`}>
                    {selected.length} / {MAX_TEAMS}
                  </span>
                </div>
                <div className="bg-[#38bdf8] p-6">
                  <div className="grid grid-cols-10 gap-3">
                    {Array.from({ length: TOTAL_TABLES }, (_, i) => i + 1).map(t => {
                      const done = raced.includes(t);
                      const on = selected.includes(t);
                      const full = !on && !done && selected.length >= MAX_TEAMS;
                      const armed = unmarkArmed === t;
                      return (
                        <button key={t} data-table={t} data-raced={done ? '1' : undefined} onClick={() => toggleTable(t)} disabled={full}
                          title={done ? '已比賽（連按兩次可解除）' : undefined}
                          className={`relative h-14 border-4 border-black font-black text-2xl transition-all ${done ? (armed ? 'bg-[#facc15] text-black' : 'bg-gray-200 text-gray-600') : on ? 'bg-[#e11d48] text-white shadow-[4px_4px_0px_#000] -translate-y-0.5' : full ? 'bg-white/60 text-gray-400 cursor-not-allowed' : 'bg-white text-black hover:bg-[#facc15] shadow-[2px_2px_0px_#000]'}`}>
                          {armed ? <span className="text-sm">再按解除</span> : pad2(t)}
                          {done && !armed && (
                            <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-80" viewBox="0 0 100 100" preserveAspectRatio="none">
                              <line x1="12" y1="12" x2="88" y2="88" stroke="#e11d48" strokeWidth="3.5" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
                              <line x1="88" y1="12" x2="12" y2="88" stroke="#e11d48" strokeWidth="3.5" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
                            </svg>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
                <div className="bg-white border-t-4 border-black px-5 py-4 flex flex-wrap items-center gap-3 justify-between">
                  <div className="flex flex-wrap gap-2 min-h-[2.5rem] items-center">
                    {selected.length === 0 && <span className="font-bold text-gray-500">尚未選擇桌號</span>}
                    {[...selected].sort((a, b) => a - b).map(t => (
                      <span key={t} className="px-3 py-1 bg-[#facc15] border-2 border-black font-black">#{pad2(t)}</span>
                    ))}
                  </div>
                  <div className="flex gap-3 items-center">
                    {raced.length > 0 && (
                      <ConfirmButton onConfirm={resetRaced} confirmText="再按一次確認重置" className={ghostBtn}>重置參賽紀錄（{raced.length}）</ConfirmButton>
                    )}
                    <button onClick={() => setView('home')} className={ghostBtn}>返回</button>
                    <button onClick={() => setSelected([])} className={ghostBtn}>清除</button>
                  </div>
                </div>
              </RetroWindow>
              <button onClick={createRoom} disabled={!canCreate || busy || !user} className={`mt-8 ${bigBtn(canCreate && !busy && !!user)}`}>
                <span>◀</span> {busy ? '建立中...' : canCreate ? `建立房間（${selected.length} 組）` : `至少選 ${MIN_TEAMS} 組`} <span>▶</span>
              </button>
            </FitStage>
          )}

          {/* ===== 房間等待畫面 ===== */}
          {view === 'room' && (
            <FitStage width={1360}>
              <TitleBlock />
              {!room ? (
                <div className="text-white font-black text-2xl animate-pulse">讀取房間中...</div>
              ) : (
                <div className="w-full max-w-7xl flex gap-6 items-stretch z-10">
                  {/* 左：房號 + QR Code */}
                  {status !== 'lobby' ? (
                    <div className="w-80 shrink-0 bg-[#facc15] border-4 border-black rounded-xl shadow-[12px_12px_0px_#000] p-5 flex flex-col items-center">
                      <div className="font-black text-black text-xl">{{ countdown: '準備起跑', racing: '比賽進行中', finished: '比賽結束', aborted: '比賽已中止' }[status]}</div>
                      <div className="mt-4 font-hud font-bold text-black/70 tracking-[0.3em] text-sm">TIME LEFT</div>
                      <div data-testid="race-timer" className={`font-latin text-[120px] leading-none mt-1 ${status === 'racing' && win && win.end - now <= 5000 ? 'text-[#e11d48] animate-pulse' : 'text-black'}`}>
                        {(() => {
                          if (!win) return '30';
                          if (status === 'countdown') return String(RACE_DURATION);
                          if (status === 'racing') return String(Math.max(0, Math.ceil((win.end - now) / 1000))).padStart(2, '0');
                          return '00';
                        })()}
                      </div>
                      <div className="font-hud font-bold text-black tracking-[0.2em] text-sm">SEC</div>
                      <div className="w-full h-1 bg-black my-6"></div>
                      <div className="font-black text-black text-lg">目標分數</div>
                      <div className="font-latin text-6xl text-black">{TARGET_SCORE}</div>
                      <div className="mt-auto w-full bg-black text-[#facc15] font-mono font-black text-center py-2 border-4 border-black">ROOM {roomCode}</div>
                    </div>
                  ) : (
                  <div className="w-80 shrink-0 bg-[#facc15] border-4 border-black rounded-xl shadow-[12px_12px_0px_#000] p-5 flex flex-col items-center">
                    <div className="font-black text-black text-xl mb-1">房間編號</div>
                    <div data-testid="room-code" className="bg-black text-[#facc15] font-mono font-black text-5xl tracking-[0.2em] pl-[0.2em] px-3 py-2 border-4 border-black mb-5">{roomCode}</div>
                    <QRCodeBox text={playerUrl(roomCode)} />
                    <p className="mt-5 font-black text-black text-center leading-snug">手機掃描 QR Code<br />或輸入房間編號加入</p>
                    <div className="mt-auto pt-5 w-full space-y-1 text-sm font-bold text-black">
                      <div className="flex items-center gap-2"><TrafficLight light="red" /> 尚無玩家</div>
                      <div className="flex items-center gap-2"><TrafficLight light="yellow" /> 等待全員準備</div>
                      <div className="flex items-center gap-2"><TrafficLight light="green" /> 準備完成</div>
                    </div>
                  </div>
                  )}

                  {/* 右：十台賽車 */}
                  <RetroWindow title="TSRC_Racing.exe" right={serverBadge} className="flex-1">
                    <div className="bg-[#38bdf8] p-6 relative flex-1">
                      <div className="absolute top-0 left-0 w-full h-4 bg-checkerboard opacity-20"></div>
                      <div className="absolute bottom-0 left-0 w-full h-4 bg-checkerboard opacity-20"></div>
                      <div className="absolute top-0 right-0 w-16 h-full bg-checkerboard border-l-4 border-black z-0"></div>
                      <div className="absolute top-0 right-16 w-4 h-full bg-[#e11d48] border-l-4 border-black z-0"></div>

                      <div className="relative z-10 flex flex-col gap-[14px]">
                        {(room.tables || []).map(t => {
                          const st = teamStatus(room, t);
                          const color = colorHex(room.teams?.[teamKey(t)]?.color);
                          const inRace = status !== 'lobby';
                          const score = status === 'finished' || status === 'aborted' ? (room.teamScores?.[teamKey(t)] ?? sums[t] ?? 0) : (sums[t] || 0);
                          const val = inRace ? Math.min((score / TARGET_SCORE) * 100, 100) : 0;
                          return (
                            <div key={t} data-lane={t} className="flex items-center gap-3">
                              <div className="w-16 h-10 bg-[#facc15] border-4 border-black rounded flex items-center justify-center shadow-[3px_3px_0px_#000] z-20 shrink-0">
                                <span className="font-black text-xl text-black">#{pad2(t)}</span>
                              </div>
                              <TrafficLight light={st.light} />
                              <div className="flex-1 h-10 bg-white border-4 border-black rounded-r-full relative shadow-[inset_0px_4px_0px_rgba(0,0,0,0.1)]">
                                {inRace && (
                                  <div className="h-full bg-[#22c55e] border-r-4 border-black transition-all duration-300 ease-out rounded-r-full" style={{ width: `${Math.max(val, 5)}%` }}></div>
                                )}
                                <div data-lane-text={t} className={`absolute top-1/2 -translate-y-1/2 font-black text-black whitespace-nowrap ${inRace ? 'right-6 text-lg' : 'left-20 text-sm'}`}>
                                  {inRace ? `${score} 分` : st.count === 0 ? '等待加入...' : `${st.count} 人・已準備 ${st.ready}/${st.count}`}
                                </div>
                                <div className="absolute top-1/2 -translate-y-1/2 z-30 transition-all duration-300 ease-out" style={{ left: `calc(${val}% - 15px)`, width: '60px', height: '35px' }}>
                                  <F1CarSVG color={color} />
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </RetroWindow>
                </div>
              )}

              {room && status === 'lobby' && (
                <div className="mt-8 flex items-center gap-6 z-10">
                  <ConfirmButton onConfirm={closeRoom} confirmText="再按一次確認取消" className={ghostBtn}>取消房間・回首頁</ConfirmButton>
                  <button onClick={startRace} disabled={!allGreen || !connected} data-testid="start-race" className={bigBtn(allGreen && connected)}>
                    <span>◀</span> {allGreen ? '開始比賽' : '全部綠燈後開放開始'} <span>▶</span>
                  </button>
                </div>
              )}
              {room && (status === 'countdown' || status === 'racing') && (
                <div className="mt-8 flex items-center gap-6 z-10">
                  <ConfirmButton onConfirm={abortRace} confirmText="再按一次確認中止" className={ghostBtn}>緊急中止比賽</ConfirmButton>
                </div>
              )}
            </FitStage>
          )}

          {/* 3、2、1、GO 倒數 */}
          {view === 'room' && win && (status === 'countdown' || (status === 'racing' && now < win.start + 1000)) && (() => {
            const left = win.start - now;
            const label = left > 0 ? String(Math.min(3, Math.ceil(left / 1000))) : 'GO!';
            return (
              <div className="absolute inset-0 z-50 bg-black/45 flex items-center justify-center pointer-events-none">
                <div key={label} data-testid="countdown" className={`count-pop font-latin leading-none ${label === 'GO!' ? 'text-[#22c55e]' : 'text-white'}`}
                  style={{ fontSize: 'min(34vw, 60vh)', WebkitTextStroke: '0.02em #000' }}>{label}</div>
              </div>
            );
          })()}

          {/* 比賽結束／中止（完整排名於第五階段加入）*/}
          {view === 'room' && room && (status === 'finished' || status === 'aborted') && (() => {
            const ranking = room.result?.ranking || [];
            const top = ranking.filter(r => r.rank === 1 && r.score > 0);
            const aborted = status === 'aborted';
            return (
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                <div data-testid="result-card" className="bg-[#facc15] border-8 border-black p-10 max-w-2xl w-full text-center shadow-[16px_16px_0px_#e11d48]">
                  {aborted ? (
                    <h2 className="font-latin text-7xl text-black mb-4">STOPPED</h2>
                  ) : (
                    <>
                      <div className="flex justify-center mb-4"><TrophyIcon /></div>
                      <h2 className="font-latin text-8xl text-black mb-4">WINNER!</h2>
                    </>
                  )}
                  <div className="inline-block bg-black text-white font-black px-4 py-1 mb-5">結束原因：{END_REASON_TEXT[room.meta?.endReason] || '—'}</div>
                  {!aborted && (
                    <div className="bg-white border-4 border-black p-4 mb-6 shadow-[6px_6px_0px_#000]">
                      {top.length ? (
                        <p className="text-4xl font-black text-black">第 <span className="text-[#e11d48] text-6xl">{top.map(r => pad2(r.table)).join('、')}</span> 桌{top.length > 1 ? '（並列）' : ''}<span className="block text-2xl mt-2">{top[0].score} 分</span></p>
                      ) : <p className="text-3xl font-black text-black">本場無人得分</p>}
                    </div>
                  )}
                  {!aborted && top.length > 0 && (
                    <p className="text-2xl font-black text-black bg-[#22c55e] border-4 border-black py-2 px-4 shadow-[4px_4px_0px_#000] mb-6">跑出命定奪冠路線！率先取得 2027 產線認證！</p>
                  )}
                  <div className="flex justify-center gap-4">
                    <ConfirmButton onConfirm={resetRace} confirmText="再按一次確認重賽" className={ghostBtn}>同組重新比賽</ConfirmButton>
                    <ConfirmButton onConfirm={closeRoom} confirmText="再按一次確認結束" className={ghostBtn}>結束房間・回首頁</ConfirmButton>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
