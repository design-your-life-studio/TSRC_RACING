<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台橡綠能方程式 - 大螢幕主畫面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <style>
        body { background-color: #111; color: #fff; overflow: hidden; font-family: 'Arial', sans-serif; }
        .track { position: relative; width: 100%; height: 50px; background: #333; margin-bottom: 10px; border-radius: 25px; overflow: hidden; }
        .car { position: absolute; left: 0; top: 0; height: 100%; width: 120px; background: linear-gradient(90deg, #10b981, #34d399); border-radius: 25px; transition: left 0.3s ease-out; display: flex; align-items: center; justify-content: flex-end; padding-right: 15px; font-weight: bold; color: #000; box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
        .finish-line { position: absolute; right: 5%; top: 0; width: 5px; height: 100%; background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px); z-index: 10; }
        .bg-popart { background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 20px 20px; background-position: 0 0, 10px 10px; }
    </style>
</head>
<body class="bg-popart">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 幫您填入的 TSRC RACING Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyAVkXL-r-MM2NSs9f6T9LPX78b-CAgCXQY",
            authDomain: "tsrc-racing.firebaseapp.com",
            projectId: "tsrc-racing",
            storageBucket: "tsrc-racing.firebasestorage.app",
            messagingSenderId: "859095220602",
            appId: "1:859095220602:web:70c4d9be106383a97656c3",
            measurementId: "G-1RLXCDE731"
        };

        window.firebaseApp = initializeApp(firebaseConfig);
        window.db = getFirestore(window.firebaseApp);
        window.auth = getAuth(window.firebaseApp);
        window.firebaseModules = { doc, onSnapshot, setDoc, updateDoc, signInAnonymously };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function MainScreen() {
            const [gameState, setGameState] = useState("waiting"); // waiting, playing, finished
            const [scores, setScores] = useState(Array(10).fill(0));
            const [winner, setWinner] = useState(null);
            const maxScore = 500; 

            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.db) return setTimeout(initFirebase, 100);
                    const { doc, onSnapshot, setDoc, signInAnonymously } = window.firebaseModules;
                    
                    try {
                        await signInAnonymously(window.auth);
                        console.log("主畫面：已匿名登入 Firebase");
                        
                        const gameRef = doc(window.db, "game", "state");
                        await setDoc(gameRef, { status: "waiting", scores: Array(10).fill(0) }, { merge: true });

                        onSnapshot(gameRef, (docSnap) => {
                            if (docSnap.exists()) {
                                const data = docSnap.data();
                                setGameState(data.status);
                                if (data.scores) {
                                    setScores(data.scores);
                                    checkWinner(data.scores);
                                }
                            }
                        });
                    } catch (error) {
                        console.error("Firebase 連線錯誤:", error);
                    }
                };
                initFirebase();
            }, []);

            const checkWinner = (currentScores) => {
                const winningTable = currentScores.findIndex(score => score >= maxScore);
                if (winningTable !== -1 && gameState === "playing") {
                    setGameState("finished");
                    setWinner(winningTable + 1);
                    if (window.db) {
                        const { doc, updateDoc } = window.firebaseModules;
                        updateDoc(doc(window.db, "game", "state"), { status: "finished" });
                    }
                }
            };

            const startGame = async () => {
                setGameState("playing");
                setScores(Array(10).fill(0));
                setWinner(null);
                
                if (window.db) {
                    const { doc, updateDoc } = window.firebaseModules;
                    await updateDoc(doc(window.db, "game", "state"), { 
                        status: "playing",
                        scores: Array(10).fill(0)
                    });
                }
            };

            const resetGame = async () => {
                if (window.db) {
                    const { doc, updateDoc } = window.firebaseModules;
                    await updateDoc(doc(window.db, "game", "state"), { 
                        status: "waiting",
                        scores: Array(10).fill(0)
                    });
                }
            };

            return (
                <div className="min-h-screen flex flex-col p-8">
                    <div className="text-center mb-8">
                        <h1 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 drop-shadow-lg mb-2">
                            2027 橡前奔馳：綠能驅動
                        </h1>
                        <p className="text-xl text-gray-400">請大家拿起手機輸入桌號！目標 500 分！</p>
                    </div>

                    <div className="flex-1 w-full max-w-6xl mx-auto relative">
                        {scores.map((score, index) => {
                            const progress = Math.min((score / maxScore) * 100, 100);
                            return (
                                <div key={index} className="flex items-center mb-4">
                                    <div className="w-16 text-2xl font-bold text-emerald-400">第 {index + 1} 桌</div>
                                    <div className="flex-1 relative">
                                        <div className="track">
                                            <div className="finish-line"></div>
                                            <div 
                                                className="car" 
                                                style={{ left: `calc(${progress}% - ${progress > 5 ? 120 : 0}px)` }}
                                            >
                                                {score}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="text-center mt-8 space-x-4">
                        {gameState === "waiting" && (
                            <button onClick={startGame} className="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-[0_0_20px_rgba(16,185,129,0.5)] transition-all transform hover:scale-105">
                                開始挑戰！
                            </button>
                        )}
                        {gameState === "finished" && (
                            <div className="absolute inset-0 bg-black bg-opacity-90 flex flex-col items-center justify-center z-50">
                                <h2 className="text-7xl font-black text-emerald-400 mb-8 animate-bounce">
                                    🏆 恭喜 第 {winner} 桌 奪冠！ 🏆
                                </h2>
                                <button onClick={resetGame} className="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-full text-xl">
                                    重新開始
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<MainScreen />, document.getElementById('root'));
    </script>
</body>
</html>
