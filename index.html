<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>綠能方程式 - 大螢幕主畫面</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 設定 Firebase 的 Import Map -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Righteous&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
    .retro-title {
      text-shadow: 4px 4px 0px #e11d48, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    }
    .retro-subtitle {
      text-shadow: 3px 3px 0px #1d4ed8, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    }
    .bg-checkerboard {
      background-image: 
        linear-gradient(45deg, #1f2937 25%, transparent 25%), 
        linear-gradient(-45deg, #1f2937 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #1f2937 75%), 
        linear-gradient(-45deg, transparent 75%, #1f2937 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.1) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(255,255,255,0.1) 2px, transparent 2px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from 'firebase/firestore';

    const { useState, useEffect } = React;

    // --- Firebase 初始化區塊 ---
    // 未來部署到 Github Pages 時，請將下方的 JSON.parse 區塊替換成您自己的 Firebase Config 結構
    const getFirebaseConfig = () => {
      if (typeof __firebase_config !== 'undefined') return JSON.parse(__firebase_config);
      return {
       apiKey: "AIzaSyAVKXL-r-MM2NSs9f6T9LPX70b-CAgCXQY",
       authDomain: "tsrc-racing.firebaseapp.com",
       projectId: "tsrc-racing",
       storageBucket: "tsrc-racing.firebasestorage.app",
       messagingSenderId: "859095220602",
       appId: "1:859095220602:web:70c4d9be106383a97656c3",
       measurementId: "G-1RLXCDE731"
      };
    };
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'tsrc-game-default';
    
    const firebaseConfig = getFirebaseConfig();
    const isFirebaseConfigured = Object.keys(firebaseConfig).length > 0;

    let app, auth, db;
    if (isFirebaseConfigured) {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    }

    // --- UI 元件 ---
    const TrophyIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-[#e11d48] drop-shadow-[4px_4px_0px_#000]">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
    );

    const F1CarSVG = () => (
      <svg viewBox="0 0 120 45" className="w-full h-full drop-shadow-md">
        <g stroke="#000" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round">
          <path d="M10,35 L110,35 L115,25 L105,25 Z" fill="#1e3a8a" />
          <path d="M5,15 L25,15 L25,25 L5,25 Z" fill="#e11d48" />
          <path d="M10,5 L15,5 L15,35 L10,35 Z" fill="#000" />
          <path d="M25,25 L45,15 L75,15 L100,25 Z" fill="#3b82f6" />
          <path d="M55,15 C55,5 70,5 70,15 Z" fill="#fff" />
          <path d="M40,25 L65,25 L65,30 L40,30 Z" fill="#22c55e" />
          <path d="M105,30 L115,30 L115,35 L105,35 Z" fill="#e11d48" />
          <circle cx="25" cy="30" r="12" fill="#1f2937" />
          <circle cx="25" cy="30" r="6" fill="#facc15" />
          <circle cx="25" cy="30" r="2" fill="#000" />
          <circle cx="90" cy="30" r="12" fill="#1f2937" />
          <circle cx="90" cy="30" r="6" fill="#facc15" />
          <circle cx="90" cy="30" r="2" fill="#000" />
          <circle cx="50" cy="20" r="6" fill="#fff" />
        </g>
      </svg>
    );

    // 到達終點的目標分數
    const TARGET_SCORE = 500; 

    const App = () => {
      const [user, setUser] = useState(null);
      const [progress, setProgress] = useState(Array(10).fill(0));
      const [status, setStatus] = useState('waiting'); // waiting, playing, finished
      const [winner, setWinner] = useState(null);

      // 1. 處理身份驗證
      useEffect(() => {
        if (!isFirebaseConfigured) {
          setUser({ uid: 'mock-local-user' });
          return;
        }

        const initAuth = async () => {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      // 2. 監聽資料庫狀態，將大家的分數轉換成進度條
      useEffect(() => {
        if (!user) return;
        
        if (!isFirebaseConfigured) {
          // 本地測試模式：模擬其他桌的賽車跑動效果
          if (status === 'playing') {
            const interval = setInterval(() => {
              setProgress(prev => {
                const newP = [...prev];
                let hasWinner = false;
                for(let i=0; i<10; i++) {
                   newP[i] += Math.random() * 4;
                   if (newP[i] >= 100 && !hasWinner) {
                      newP[i] = 100;
                      setWinner(i + 1);
                      setStatus('finished');
                      hasWinner = true;
                   }
                }
                return newP;
              });
            }, 1000);
            return () => clearInterval(interval);
          }
          return;
        }

        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'game', 'state');
        const unsubscribe = onSnapshot(docRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            setStatus(data.status || 'waiting');
            setWinner(data.winner || null);
            
            if (data.scores) {
              const newProgress = [];
              let currentWinner = null;
              
              // 結算 1 到 10 桌的進度
              for (let i = 1; i <= 10; i++) {
                const score = data.scores[i] || 0;
                const percent = Math.min((score / TARGET_SCORE) * 100, 100);
                newProgress.push(percent);
                
                // 如果有人達到 100%，標記為贏家
                if (percent >= 100 && !currentWinner) {
                  currentWinner = i;
                }
              }
              setProgress(newProgress);
              
              // 如果遊戲還在進行中，但有人贏了，主動更新資料庫結束遊戲
              if (currentWinner && data.status === 'playing') {
                updateDoc(docRef, { status: 'finished', winner: currentWinner }).catch(console.error);
              }
            }
          }
        }, (error) => console.error("Firebase Sync Error", error));
        
        return () => unsubscribe();
      }, [user, status]);

      // 3. 由主辦單位點擊開始遊戲
      const startGame = async () => {
        if (!user) return;
        
        if (!isFirebaseConfigured) {
          setStatus('playing');
          setProgress(Array(10).fill(0));
          setWinner(null);
          return;
        }

        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'game', 'state');
        // 初始化所有桌次分數為 0
        const initialScores = {};
        for(let i = 1; i <= 10; i++) initialScores[i] = 0;
        
        await setDoc(docRef, {
          status: 'playing',
          scores: initialScores,
          winner: null
        });
      };

      const resetGame = async () => {
        if (!user) return;
        
        if (!isFirebaseConfigured) {
          setStatus('waiting');
          setProgress(Array(10).fill(0));
          setWinner(null);
          return;
        }

        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'game', 'state');
        await updateDoc(docRef, { status: 'waiting', winner: null });
      };

      return (
        <div className="min-h-screen bg-[#1e3a8a] bg-grid flex flex-col items-center justify-center p-6 relative overflow-hidden">
          <div className="text-center mb-6 z-10">
            <h2 className="text-3xl font-black italic text-white retro-subtitle tracking-wider mb-2">解鎖你的 2027 冠軍賽道</h2>
            <h1 className="text-6xl md:text-7xl font-black italic text-white retro-title tracking-widest transform -skew-x-6">綠能方程式</h1>
          </div>

          <div className="w-full max-w-6xl bg-white border-4 border-black rounded-xl shadow-[12px_12px_0px_#000] overflow-hidden z-10 flex flex-col">
            <div className="bg-[#f1f5f9] border-b-4 border-black p-3 flex justify-between items-center">
              <div className="flex items-center gap-4">
                <div className="flex gap-2">
                  <div className="w-5 h-5 rounded-full bg-[#e11d48] border-2 border-black"></div>
                  <div className="w-5 h-5 rounded-full bg-[#facc15] border-2 border-black"></div>
                  <div className="w-5 h-5 rounded-full bg-[#22c55e] border-2 border-black"></div>
                </div>
                <span className="font-black text-black text-xl tracking-wider uppercase font-['Righteous']">TSRC_Racing.exe</span>
              </div>
              <div className="flex items-center gap-2 px-3 py-1 bg-black text-white text-sm font-bold font-mono rounded">
                <span className={`animate-pulse ${user ? 'text-green-400' : 'text-red-400'}`}>●</span> SERVER {user ? 'ONLINE' : 'OFFLINE'}
              </div>
            </div>

            <div className="bg-[#38bdf8] p-6 relative">
              <div className="absolute top-0 left-0 w-full h-4 bg-checkerboard opacity-20"></div>
              <div className="absolute bottom-0 left-0 w-full h-4 bg-checkerboard opacity-20"></div>
              <div className="absolute top-0 right-0 w-16 h-full bg-checkerboard border-l-4 border-black z-0"></div>
              <div className="absolute top-0 right-16 w-4 h-full bg-[#e11d48] border-l-4 border-black z-0"></div>

              <div className="relative z-10 flex flex-col gap-[14px]">
                {progress.map((val, idx) => (
                  <div key={idx} className="flex items-center gap-3">
                    <div className="w-16 h-10 bg-[#facc15] border-4 border-black rounded flex items-center justify-center shadow-[3px_3px_0px_#000] z-20 shrink-0">
                      <span className="font-black text-xl text-black">#{idx + 1}</span>
                    </div>
                    <div className="flex-1 h-10 bg-white border-4 border-black rounded-r-full relative shadow-[inset_0px_4px_0px_rgba(0,0,0,0.1)]">
                      <div className="h-full bg-[#22c55e] border-r-4 border-black transition-all duration-300 ease-out rounded-r-full flex items-center justify-end pr-2" style={{ width: `${Math.max(val, 5)}%` }}>
                        <span className="text-black font-black italic mr-8 text-sm opacity-80">{Math.floor(val)}%</span>
                      </div>
                      <div className="absolute top-1/2 -translate-y-1/2 transition-all duration-300 ease-out z-30" style={{ left: `calc(${val}% - 15px)`, width: '60px', height: '35px' }}>
                        <F1CarSVG />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <button onClick={startGame} disabled={status === 'playing'} className={`mt-8 px-10 py-4 rounded-full border-4 border-black font-black text-2xl tracking-widest flex items-center gap-4 transition-all z-10 ${status === 'playing' ? 'bg-gray-400 text-gray-700 cursor-not-allowed shadow-[0px_0px_0px_#000] translate-y-[6px]' : 'bg-[#e11d48] text-white shadow-[6px_6px_0px_#000] hover:bg-[#be123c] active:shadow-[0px_0px_0px_#000] active:translate-y-[6px]'}`}>
            <span>◀</span> {status === 'playing' ? '賽事進行中...' : '開始挑戰'} <span>▶</span>
          </button>

          {winner && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-[#facc15] border-8 border-black p-10 max-w-2xl text-center shadow-[16px_16px_0px_#e11d48] transform rotate-2 animate-bounce">
                <div className="flex justify-center mb-6"><TrophyIcon /></div>
                <h2 className="text-7xl font-black italic text-white retro-title mb-4 uppercase">WINNER!</h2>
                <div className="bg-white border-4 border-black p-4 inline-block mb-6 shadow-[6px_6px_0px_#000]">
                  <p className="text-4xl font-black text-black">第 <span className="text-[#e11d48] text-6xl">{winner}</span> 桌</p>
                </div>
                <p className="text-2xl font-black text-black bg-[#22c55e] border-4 border-black py-2 px-4 shadow-[4px_4px_0px_#000]">跑出命定奪冠路線！率先取得 2027 產線認證！</p>
                <button onClick={resetGame} className="mt-8 bg-black text-white px-8 py-3 font-bold text-xl hover:bg-gray-800 transition-colors">[ 關閉並準備下一場 / RESET ]</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
