    const SoundIcon = ({ on }) => (
      <svg viewBox="140 165 252 210" fill="currentColor" aria-hidden="true" className="h-[22px] w-auto shrink-0"
        dangerouslySetInnerHTML={{ __html: on ? SOUND_ICON_ON : SOUND_ICON_OFF }} />
    );

    // ================= 主程式 =================
    const App = () => {
      const [user, setUser] = useState(null);
      const [connected, setConnected] = useState(false);
      const [view, setView] = useState('loading'); // loading | home | setup | room
      // 開場畫面：進入網頁時停留 3 秒再淡出（重新整理接回進行中的房間時略過，避免擋住比賽畫面）
      const formulaRef = useRef(null);   // 首頁「方程式」三個字（英文副標對齊用）
      const splashTitleRef = useRef(null);   // 開場畫面「綠能方程式」（標語對齊用）
      const homeCarRef = useRef(null);   // 首頁賽車（起跑燈循環用）
      const lightsRef = useRef(null);    // 首頁 F1 起跑燈
      const [launching, setLaunching] = useState(false);
      const [splash, setSplash] = useState(() => (store.get(HOST_STORAGE_KEY) ? 'off' : 'show'));
      useEffect(() => {
        if (splash !== 'show') return;
        const t1 = setTimeout(() => setSplash('fade'), SPLASH_MS);
        const t2 = setTimeout(() => setSplash('off'), SPLASH_MS + SPLASH_FADE_MS);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, []);
      // 首頁進場動畫：開場畫面開始淡出時播放
      const homeIntro = view === 'home' && splash !== 'show';
      // 首頁賽車顏色：一開始是極速藍，每次開走再進場就換下一色（16 色循環）
      const [homeCarColor, setHomeCarColor] = useState(() => CAR_COLORS.findIndex(c => c.id === 'blue'));
      // F1 起跑燈循環：紅燈依序亮 5 顆 → 全部變綠、賽車衝出畫面 → 熄燈、賽車從另一側開回來 → 休息
      useEffect(() => {
        if (!homeIntro || prefersReducedMotion()) return;
        // 時間軸（毫秒，從第 1 顆紅燈算起）：紅燈每 0.7 秒亮一顆 → 5 顆全亮後 0.5 秒變綠燈並出發 → 綠燈 1.4 秒後熄燈、賽車開回來
        const RED_GAP = 700, HOLD_MS = 500, GREEN_MS = 1400, CYCLE_MS = 8100;
        const GO_AT = RED_GAP * 4 + HOLD_MS;            // 3.3 秒變綠燈
        const PLAN = [
          ...[1, 2, 3, 4, 5].map((n, i) => [RED_GAP * i, n]),
          [GO_AT, 'go'],
          [GO_AT + GREEN_MS, 'back'],
        ];
        let timers = [];
        const apply = (st) => {
          const ls = lightsRef.current ? [...lightsRef.current.children] : [];
          const car = homeCarRef.current;
          if (!car || !ls.length || car.closest('.hm-launch')) return;
          const n = typeof st === 'number' ? st : 0;
          ls.forEach((l, i) => { l.classList.toggle('lit', i < n); l.classList.toggle('green', st === 'go'); });
          if (st === 'go') { car.classList.remove('race-in'); void car.offsetWidth; car.classList.add('race-out'); }
          if (st === 'back') { setHomeCarColor(i => (i + 1) % CAR_COLORS.length); car.classList.remove('race-out'); void car.offsetWidth; car.classList.add('race-in'); }
          // 起跑燈音效（每一輪都有）：紅燈「嗶」→ 綠燈高音＋賽車衝刺離開 → 賽車開回來
          if (typeof st === 'number' && st > 0) Sound.sfx('redLight');
          if (st === 'go') { Sound.sfx('greenLight'); setTimeout(() => Sound.sfx('carDash'), 80); }
          if (st === 'back') Sound.sfx('carBack');
        };
        const cycle = () => {
          timers = PLAN.map(([t, st]) => setTimeout(() => apply(st), t));
          timers.push(setTimeout(cycle, CYCLE_MS));
        };
        const t0 = setTimeout(cycle, 2200 + RED_GAP);     // 等進場動畫結束再開始
        return () => { clearTimeout(t0); timers.forEach(clearTimeout); };
      }, [homeIntro]);
      // 按下「開始遊戲」：賽車衝出畫面後再切到選桌畫面
      const startGame = () => {
        if (launching) return;
        setSelected([]);
        Sound.sfx('carDash');   // 賽車衝刺離開
        if (prefersReducedMotion()) { setView('setup'); return; }
        setLaunching(true);
        setTimeout(() => { setLaunching(false); setView('setup'); }, LAUNCH_MS);
      };
      const [selected, setSelected] = useState([]);
      const [raced, setRaced] = useState(loadRaced);
      const [unmarkArmed, setUnmarkArmed] = useState(null); // 準備解除註記的桌號
      const [history, setHistory] = useState(loadHistory);
      const [showHistory, setShowHistory] = useState(false);
      const [roomCode, setRoomCode] = useState(null);
      const [room, setRoom] = useState(null);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');
      useEffect(() => { if (!error) return; const t = setTimeout(() => setError(''), 8000); return () => clearTimeout(t); }, [error]);
      const [now, setNow] = useState(Date.now());      // 伺服器時間（比賽中每 0.1 秒更新）
      const offsetRef = useRef(0);                      // 本機與 Firebase 伺服器的時間差
      const sumsRef = useRef({});
      const refereeRef = useRef({ racingFor: null, finishedFor: null });
      const lastSyncRef = useRef('');

      // 1. 匿名登入 + 連線狀態
      useEffect(() => {
        signInAnonymously(auth).catch(err => { console.error(err); setError('Firebase 登入失敗，請確認網路與匿名登入設定'); });
        const unAuth = onAuthStateChanged(auth, setUser);
        const unConn = onValue(ref(db, '.info/connected'), s => setConnected(s.val() === true));
        return () => { unAuth(); unConn(); };
      }, []);

      // 2. 重新整理時，接回自己建立且尚未關閉的房間
      useEffect(() => {
        if (!user) return;
        const saved = store.get(HOST_STORAGE_KEY);
        if (!saved) { setView('home'); return; }
        get(ref(db, `rooms/${saved}/meta`)).then(s => {
          const m = s.val();
          if (m && m.hostUid === user.uid && m.status !== 'closed') { setRoomCode(saved); setView('room'); }
          else { store.del(HOST_STORAGE_KEY); setView('home'); }
        }).catch(() => setView('home'));
      }, [user]);

      // 3. 監聽房間資料 + 主控端在線狀態（斷線時自動標記離線，重連後恢復）
      useEffect(() => {
        if (!roomCode) { setRoom(null); return; }
        const unRoom = onValue(ref(db, `rooms/${roomCode}`), s => setRoom(s.val()), err => console.error(err));
        const onlineRef = ref(db, `rooms/${roomCode}/meta/hostOnline`);
        const unConn = onValue(ref(db, '.info/connected'), s => {
          if (s.val() !== true) return;
          onDisconnect(onlineRef).set(false).then(() => set(onlineRef, true)).catch(console.error);
        });
        return () => { unRoom(); unConn(); };
      }, [roomCode]);

      // 房間被刪除時回首頁
      useEffect(() => {
        if (view === 'room' && roomCode && room === null) {
          const t = setTimeout(() => { get(ref(db, `rooms/${roomCode}/meta`)).then(s => { if (!s.exists()) leaveRoom('home'); }); }, 1500);
          return () => clearTimeout(t);
        }
      }, [room, view, roomCode]);

      // 隊長備援 + 顏色防撞：準備階段由主控端確保每組隊長正確、各組顏色不重複
      useEffect(() => {
        if (!room || !roomCode || room.meta?.status !== 'lobby') return;
        const updates = {};
        const used = new Set();
        (room.tables || []).forEach(t => {
          const key = teamKey(t);
          const current = room.teams?.[key]?.leaderUid || null;
          const desired = resolveLeader(room.players?.[key], current);
          if (desired !== current) updates[`teams/${key}/leaderUid`] = desired;
          let color = room.teams?.[key]?.color;
          if (!color || used.has(color)) {
            const free = CAR_COLORS.find(c => !used.has(c.id) && !(room.tables || []).some(o => o !== t && room.teams?.[teamKey(o)]?.color === c.id));
            if (free) { color = free.id; updates[`teams/${key}/color`] = color; }
          }
          used.add(color);
        });
        if (Object.keys(updates).length) update(ref(db, `rooms/${roomCode}`), updates).catch(console.error);
      }, [room, roomCode]);

      // ===== 比賽控制（主控端擔任裁判）=====
      const status = room?.meta?.status || 'lobby';
      const win = raceWindow(room?.meta);
      const sums = useMemo(() => teamSums(room), [room]);
      sumsRef.current = sums;

      // 伺服器時間差：所有裝置用同一個時鐘計算倒數
      useEffect(() => onValue(ref(db, '.info/serverTimeOffset'), s => { offsetRef.current = Number(s.val()) || 0; }), []);

      const finishRace = (reason) => {
        if (!room || !win || refereeRef.current.finishedFor === win.countdownAt) return;
        refereeRef.current.finishedFor = win.countdownAt;
        const ranking = rankTeams(room.tables || [], sumsRef.current);
        const teamScores = {};
        ranking.forEach(r => { teamScores[teamKey(r.table)] = r.score; });
        update(ref(db, `rooms/${roomCode}`), {
          'meta/status': 'finished', 'meta/endReason': reason, 'meta/finishedAt': serverTimestamp(),
          teamScores, result: { reason, ranking },
        }).catch(err => { console.error(err); refereeRef.current.finishedFor = null; setError(`結算失敗：${errText(err)}`); });
      };

      // 計時與結束判斷：倒數結束 → 正式開賽；任一組達 500 分或 30 秒到 → 結束
      useEffect(() => {
        if (!win || !['countdown', 'racing'].includes(status)) return;
        const tick = () => {
          const t = Date.now() + offsetRef.current;
          setNow(t);
          if (status === 'countdown' && t >= win.start && refereeRef.current.racingFor !== win.countdownAt) {
            refereeRef.current.racingFor = win.countdownAt;
            update(ref(db, `rooms/${roomCode}/meta`), { status: 'racing' }).catch(err => { console.error(err); refereeRef.current.racingFor = null; setError(`開賽失敗：${errText(err)}`); });
          }
          if (status === 'racing') {
            if (Object.values(sumsRef.current).some(v => v >= TARGET_SCORE)) finishRace('target');
            else if (t >= win.end + FINISH_GRACE_MS) finishRace('timeout');
          }
        };
        tick();
        const id = setInterval(tick, 100);
        return () => clearInterval(id);
      }, [status, win?.countdownAt, roomCode]);

      // 有組別達標時立即結束（不用等下一次計時）
      useEffect(() => {
        if (status === 'racing' && Object.values(sums).some(v => v >= TARGET_SCORE)) finishRace('target');
      }, [sums, status]);

      // 比賽中把各組總分同步給手機（節流）
      useEffect(() => {
        if (status !== 'racing' || !roomCode) return;
        const id = setInterval(() => {
          const payload = {};
          Object.entries(sumsRef.current).forEach(([t, v]) => { payload[teamKey(t)] = v; });
          const key = JSON.stringify(payload);
          if (key === lastSyncRef.current) return;
          lastSyncRef.current = key;
          set(ref(db, `rooms/${roomCode}/teamScores`), payload).catch(console.error);
        }, TEAM_SCORE_SYNC_MS);
        return () => clearInterval(id);
      }, [status, roomCode]);

      const allGreen = !!room?.tables?.length && room.tables.every(t => teamStatus(room, t).light === 'green');

      // ================= 音樂與音效 =================
      const [soundState, setSoundState] = useState(Sound.state());
      useEffect(() => Sound.subscribe(setSoundState), []);
      // 鍵盤 F：進入全螢幕（再按一次 F 也可以退出）；Esc：退出全螢幕（瀏覽器內建）
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== 'f' && e.key !== 'F') return;
          if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
          const tag = (e.target?.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || e.target?.isContentEditable) return;
          e.preventDefault();
          if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
          else (document.documentElement.requestFullscreen?.() || Promise.resolve()).catch(() => {});
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      const finalPhase = status === 'racing' && !!win && now >= win.end - 5000;
      const [resultMusic, setResultMusic] = useState(false);   // 結算音效播完後，才放回等待配樂
      let bgmKey = null;
      if (splash !== 'show') {
        if (view === 'home') bgmKey = 'home';
        else if (view === 'setup') bgmKey = 'lobby';
        else if (view === 'room' && room) {
          if (status === 'lobby') bgmKey = 'lobby';
          else if (status === 'racing') bgmKey = finalPhase ? 'final' : 'race';
          else if ((status === 'finished' || status === 'aborted') && resultMusic) bgmKey = 'lobby';
        }
      }
      useEffect(() => { Sound.music(bgmKey); }, [bgmKey]);
      useEffect(() => () => Sound.music(null), []);
      // 開場畫面
      useEffect(() => { if (splash === 'show') Sound.sfx('splash'); }, [splash]);
      // 首頁進場：標題逐字蓋章、賽車開進來、按鈕彈出
      useEffect(() => {
        if (!homeIntro || launching) return;
        const ts = [0, 1, 2, 3, 4].map(i => setTimeout(() => Sound.sfx('thump'), 550 + i * 90));
        ts.push(setTimeout(() => Sound.sfx('carIn'), 600), setTimeout(() => Sound.sfx('popIn'), 1420));
        return () => ts.forEach(clearTimeout);
      }, [homeIntro]);
      // 換頁：進到選桌畫面、房間建立成功
      const prevViewRef = useRef(view);
      useEffect(() => {
        const prev = prevViewRef.current; prevViewRef.current = view;
        if (view === 'setup' && prev !== 'setup') Sound.sfx('pageIn');
        if (view === 'room' && prev === 'setup') Sound.sfx('roomCreated');
      }, [view]);
      // 房間等待：玩家加入、車隊全員準備（亮綠燈）、全部準備完成
      const onlineCount = (room?.tables || []).reduce((a, t) => a + teamStatus(room, t).count, 0);
      const greenCount = (room?.tables || []).filter(t => teamStatus(room, t).light === 'green').length;
      const lobbyRef = useRef({ code: null, online: 0, green: 0, all: false });
      useEffect(() => {
        const p = lobbyRef.current;
        if (view !== 'room' || !room || status !== 'lobby' || p.code !== roomCode) { lobbyRef.current = { code: roomCode, online: onlineCount, green: greenCount, all: allGreen }; return; }
        if (allGreen && !p.all) Sound.sfx('allReady');
        else if (greenCount > p.green) Sound.sfx('teamReady');
        else if (onlineCount > p.online) Sound.sfx('join');
        lobbyRef.current = { code: roomCode, online: onlineCount, green: greenCount, all: allGreen };
      }, [view, status, roomCode, onlineCount, greenCount, allGreen]);
      // 倒數 3・2・1・GO
      const cdLabel = view === 'room' && win && (status === 'countdown' || (status === 'racing' && now < win.start + 1000))
        ? (win.start - now > 0 ? String(Math.min(3, Math.ceil((win.start - now) / 1000))) : 'GO!') : null;
      useEffect(() => { if (cdLabel === 'GO!') Sound.sfx('go'); else if (cdLabel) Sound.sfx('countBeep'); }, [cdLabel]);
      // 最後 5 秒：每秒一聲提示（配樂同時換成升調衝刺版）
      const secLeft = status === 'racing' && win ? Math.ceil((win.end - now) / 1000) : null;
      useEffect(() => { if (secLeft !== null && secLeft >= 1 && secLeft <= 5) Sound.sfx('tick', 5 - secLeft); }, [secLeft]);
      // 比賽結束：結果畫面出現的同一刻播放冠軍號角（中止則播失敗音）→ 播完回到等待配樂
      useEffect(() => {
        if (status !== 'finished' && status !== 'aborted') { setResultMusic(false); return; }
        const ts = [];
        if (status === 'aborted') { Sound.sfx('abort'); ts.push(setTimeout(() => setResultMusic(true), 2500)); }
        else { Sound.sfx('victory'); ts.push(setTimeout(() => setResultMusic(true), 4200)); }
        return () => ts.forEach(clearTimeout);
      }, [status, win?.countdownAt]);

      const startRace = () => {
        if (!room || status !== 'lobby' || !allGreen) return;
        lastSyncRef.current = '';
        update(ref(db, `rooms/${roomCode}`), {
          'meta/status': 'countdown', 'meta/countdownAt': serverTimestamp(), 'meta/endReason': null, 'meta/finishedAt': null,
          scores: null, teamScores: null, result: null,
        }).catch(err => { console.error(err); setError(`開始失敗：${errText(err)}`); });
      };

      // 緊急中止：立即停止比賽並保留當下分數
      const abortRace = () => {
        if (!room || !['countdown', 'racing'].includes(status)) return;
        refereeRef.current.finishedFor = win?.countdownAt ?? 'aborted';
        const ranking = rankTeams(room.tables || [], sumsRef.current);
        update(ref(db, `rooms/${roomCode}`), {
          'meta/status': 'aborted', 'meta/endReason': 'aborted', 'meta/finishedAt': serverTimestamp(),
          result: { reason: 'aborted', ranking },
        }).catch(err => { console.error(err); setError(`中止失敗：${errText(err)}`); });
      };

      // 重置本場：同一批車隊回到準備狀態（全員需重新確認準備）
      const resetRace = () => {
        if (!room) return;
        const updates = {
          'meta/status': 'lobby', 'meta/countdownAt': null, 'meta/endReason': null, 'meta/finishedAt': null,
          scores: null, teamScores: null, result: null,
        };
        Object.entries(room.players || {}).forEach(([k, members]) => {
          Object.keys(members || {}).forEach(id => { updates[`players/${k}/${id}/ready`] = false; });
        });
        refereeRef.current = { racingFor: null, finishedFor: null };
        update(ref(db, `rooms/${roomCode}`), updates).catch(err => { console.error(err); setError(`重置失敗：${errText(err)}`); });
      };

      // 比賽正式開始（進入倒數）後，把本場桌號記錄為「已比賽」
      const roomStatus = room?.meta?.status;
      useEffect(() => {
        if (!room?.tables || !['countdown', 'racing', 'finished'].includes(roomStatus)) return;
        setRaced(prev => {
          const next = [...new Set([...prev, ...room.tables])].sort((a, b) => a - b);
          if (next.length === prev.length) return prev;
          saveRaced(next);
          return next;
        });
      }, [roomStatus, room?.tables]);

      useEffect(() => {
        if (unmarkArmed === null) return;
        const t = setTimeout(() => setUnmarkArmed(null), 3000);
        return () => clearTimeout(t);
      }, [unmarkArmed]);

      const toggleTable = (t) => {
        setError('');
        if (raced.includes(t)) {
          // 已比賽的桌號：按兩次可解除註記（例如比賽中途緊急中止要重賽）
          if (unmarkArmed === t) {
            const next = raced.filter(x => x !== t);
            setRaced(next); saveRaced(next); setUnmarkArmed(null);
          } else setUnmarkArmed(t);
          return;
        }
        setSelected(prev => prev.includes(t) ? prev.filter(x => x !== t) : prev.length >= MAX_TEAMS ? prev : [...prev, t]);
      };

      const resetRaced = () => { setRaced([]); saveRaced([]); setUnmarkArmed(null); };
      const clearHistory = () => { setHistory([]); saveHistory([]); };

      // 比賽正常結束（非緊急中止）時自動存成績紀錄；同組重賽會各自存一筆
      useEffect(() => {
        if (!room || !roomCode || room.meta?.status !== 'finished' || !room.result || !room.meta?.countdownAt) return;
        const id = `${roomCode}-${room.meta.countdownAt}`;
        setHistory(prev => {
          if (prev.some(r => r.id === id)) return prev;
          const next = [...prev, buildRecord(room, roomCode)];
          saveHistory(next);
          return next;
        });
      }, [room, roomCode]);
      const canCreate = selected.length >= MIN_TEAMS && selected.length <= MAX_TEAMS;

      // 建立房間：隨機 6 碼，用 transaction 確保不與既有房間重複
      const createRoom = async () => {
        if (!canCreate || !user || busy) return;
        setBusy(true); setError('');
        try {
          const tables = [...new Set(selected)].filter(t => !raced.includes(t)).sort((a, b) => a - b);
          if (tables.length !== selected.length) throw new Error('桌號重複或已比賽過');
          if (tables.length < MIN_TEAMS || tables.length > MAX_TEAMS) throw new Error(`請選擇 ${MIN_TEAMS}～${MAX_TEAMS} 組`);
          const teams = {};
          tables.forEach((t, i) => { teams[teamKey(t)] = { color: CAR_COLORS[i % CAR_COLORS.length].id }; });
          let code = null;
          for (let i = 0; i < 20 && !code; i++) {
            const candidate = String(100000 + Math.floor(Math.random() * 900000));
            const data = { meta: { hostUid: user.uid, createdAt: Date.now(), status: 'lobby' }, tables, teams };
            const res = await runTransaction(ref(db, `rooms/${candidate}`), cur => (cur === null ? data : undefined));
            if (res.committed) code = candidate;
          }
          if (!code) throw new Error('無法產生房間編號，請再試一次');
          store.set(HOST_STORAGE_KEY, code);
          setRoomCode(code);
          setView('room');
        } catch (err) {
          console.error(err);
          setError(`建立房間失敗：${errText(err)}`);
        } finally {
          setBusy(false);
        }
      };

      // next：離開後要去的畫面（'home' 首頁／'setup' 選擇參賽桌號）
      const [roomExit, setRoomExit] = useState(false);
      const leaveRoom = (next = 'home') => {
        store.del(HOST_STORAGE_KEY);
        setRoomCode(null);
        setRoom(null);
        setSelected([]);
        setView(next);
      };

      // 緊急中止／取消房間：標記為關閉，手機端會自動退出
      // keepTables：回到選桌畫面時保留這個房間原本選的桌號，方便直接修改後重新建立
      const closeRoom = async (next = 'home', keepTables = false) => {
        const tables = room?.tables || [];
        const animate = !prefersReducedMotion();
        if (animate) setRoomExit(true);   // 先讓比賽畫面淡出，再切到下一頁
        await Promise.all([
          update(ref(db, `rooms/${roomCode}/meta`), { status: 'closed', closedAt: Date.now() }).catch(err => console.error(err)),
          animate ? new Promise(r => setTimeout(r, ROOM_EXIT_MS)) : null,
        ]);
        leaveRoom(next);
        if (keepTables) setSelected(tables);
        setRoomExit(false);
      };

      const serverBadge = (
        <div className="flex items-center gap-2 px-3 py-1 bg-black text-white text-sm font-bold font-mono rounded">
          <span className={`animate-pulse ${connected ? 'text-green-400' : 'text-red-400'}`}>●</span> SERVER {connected ? 'ONLINE' : 'RECONNECTING...'}
        </div>
      );

      return (
        <div className="h-screen w-screen bg-[#1e3a8a] flex flex-col items-center justify-center relative overflow-hidden isolate">
          {/* 背景格紋：每一頁持續流動 */}
          <BgFlow style={{ zIndex: -1 }} />

          {/* 音效開關（左下角）：第一次點擊啟動聲音，之後可切換開／關 */}
          <button data-testid="sound-toggle" onClick={() => Sound.toggle()}
            aria-label={!soundState.unlocked ? '點此開啟音效' : soundState.enabled ? '音效：開（點擊關閉）' : '音效：關（點擊開啟）'}
            title={!soundState.unlocked ? '點此開啟音效' : soundState.enabled ? '音效：開（點擊關閉）' : '音效：關（點擊開啟）'}
            className={`absolute left-5 bottom-4 z-[90] flex items-center gap-2 text-white font-black text-base tracking-wider hover:text-[#fef9c3] active:translate-y-[2px] transition-colors ${!soundState.unlocked && soundState.enabled ? 'animate-pulse' : ''}`}>
            {/* 尚未啟動：只顯示文字；啟動後：只顯示開／關圖示 */}
            {!soundState.unlocked
              ? <span>點此開啟音效</span>
              : <SoundIcon on={soundState.enabled} />}   {/* 圖示高 22px（尺寸方案 03）*/}
          </button>
          {error && (
            <div className="absolute top-4 left-1/2 -translate-x-1/2 z-50 bg-[#e11d48] text-white font-black px-4 py-2 border-4 border-black shadow-[4px_4px_0px_#000]">{error}</div>
          )}

          {view === 'loading' && <TitleBlock big />}

          {/* 開場畫面 */}
          {splash !== 'off' && (
            <div data-testid="splash" className="absolute inset-0 z-[80] bg-[#1e3a8a] flex items-center justify-center isolate"
              style={{ opacity: splash === 'fade' ? 0 : 1, transition: `opacity ${SPLASH_FADE_MS}ms ease`, pointerEvents: splash === 'fade' ? 'none' : 'auto' }}>
              <BgFlow style={{ zIndex: -1 }} />
              <div className="flex flex-col items-center" style={{ fontSize: 'min(1vw, 1.8vh)' }}>
                {/* 黃線＋標語：整體寬度與「綠能方程式」相同 */}
                <FitWidthText targetRef={splashTitleRef} className="mb-[2.5vh]">
                    <span className="inline-flex items-center gap-[0.6em] text-white">
                      <span className="inline-block h-[0.1em] min-h-[3px] w-[3em] bg-[#facc15]"></span>
                      <span className="inline-block font-medium tracking-[0.2em]">解鎖 2027 冠軍賽<span className="tracking-normal">道</span></span>
                    </span>
                  </FitWidthText>
                <h1 style={{ fontSize: 'clamp(80px, min(11vw, 20vh), 240px)' }}><LogoText><span ref={splashTitleRef} className="inline-block">綠能方程式</span></LogoText></h1>
              </div>
            </div>
          )}

          {/* ===== 遊戲首頁（海報式排版）===== */}
          {view === 'home' && (
            <div className={`absolute inset-0 flex flex-col z-10 text-white hm-live ${homeIntro && !launching ? 'hm-intro' : ''} ${launching ? 'hm-launch' : ''}`}>
              {/* 上方資訊列 */}
              <div className="flex items-center justify-between px-[4vw] pt-[4vh] font-hud font-bold tracking-[0.3em]" style={{ fontSize: 'clamp(12px, min(1vw, 1.8vh), 20px)' }}>
                <div className="text-white/60 hm-season hm-fadeout">SEASON 2027</div>
                <div className="tracking-normal">{serverBadge}</div>
              </div>

              {/* 主視覺 */}
              <div className="flex-1 grid grid-cols-[1.1fr_1fr] items-center gap-[3vw] px-[6vw]">
                {/* 左欄疊在賽車上層：賽車進場時從標題後方穿過 */}
                <div className="hm-exit flex flex-col items-start relative z-[2]">
                  {/* 黃線＋副標：整體寬度與「方程式」相同 */}
                  <FitWidthText targetRef={formulaRef} className="mb-[2.5vh]">
                    <span className="inline-flex items-center gap-[0.6em] text-white">
                      <span className="hm-bar inline-block h-[0.1em] min-h-[3px] w-[3em] bg-[#facc15]"></span>
                      <span className="hm-tagtxt inline-block font-medium tracking-[0.2em]">解鎖 2027 冠軍賽<span className="tracking-normal">道</span></span>
                    </span>
                  </FitWidthText>
                  <h1 className="hm-dim" style={{ fontSize: 'clamp(84px, min(10.5vw, 19vh), 230px)' }}><LogoText><IntroChars text="綠能" /><br /><span ref={formulaRef} className="inline-block"><IntroChars text="方程式" from={2} /></span></LogoText></h1>
                  <FitWidthText targetRef={formulaRef} className="font-winner text-[#facc15] mt-[2.5vh] hm-eng">GREEN ENERGY FORMULA</FitWidthText>
                  <div className="hm-pop mt-[5vh]">
                    <div className={user ? 'hm-breath' : ''}>
                      <button onClick={startGame} disabled={!user}
                        className={`${bigBtn(!!user)} !gap-[0.6em]`} style={{ fontSize: 'clamp(22px, min(2.2vw, 4.2vh), 48px)', padding: '0.45em 1.4em', borderWidth: 'clamp(4px, 0.35vw, 7px)' }}>
                        開始遊戲
                      </button>
                    </div>
                  </div>
                </div>

                <div className="relative flex flex-col items-center justify-center">
                  <div className="relative w-full" style={{ maxWidth: 'min(40vw, 72vh)' }}>
                    {/* F1 起跑燈 */}
                    <div className="hm-fadeout absolute left-0 right-0 flex justify-center pointer-events-none" style={{ bottom: 'calc(100% + 6vh)' }}>
                      <div ref={lightsRef} className="hm-lights" style={{ fontSize: 'clamp(22px, min(2.3vw, 4.2vh), 46px)' }}>
                        {[0, 1, 2, 3, 4].map(i => <div key={i} className="hm-light"></div>)}
                      </div>
                    </div>
                    {/* 2027 外框大字：以賽車為中心 */}
                    <div className="relative">
                      <div className="outline-num hm-num hm-fadeout absolute select-none pointer-events-none whitespace-nowrap"
                        style={{ fontSize: 'clamp(160px, min(21vw, 38vh), 460px)', left: '50%', top: '50%', transform: 'translate(-50%, -50%)' }}>2027</div>
                      <div ref={homeCarRef} className="hm-car relative w-full aspect-[120/45]">
                        <div className="hm-speed sp-stripe">{[['#facc15', '0%', '0s'], ['#ffffff', '39%', '.15s'], ['#e11d48', '78%', '.3s']].map(([c, t, d]) => <i key={c} style={{ top: t, background: c, animationDelay: d }}></i>)}</div>
                        <F1CarSVG color={CAR_COLORS[homeCarColor].hex} />
                      </div>
                    </div>
                    {/* START／FINISH 賽道線：放在 2027 大字下方，不重疊 */}
                    <div className="hm-fadeout" style={{ marginTop: 'max(2vh, calc(0.447 * clamp(160px, min(21vw, 38vh), 460px) - 0.1875 * min(40vw, 72vh) + 2.5vh))' }}><div className="hm-track flex items-center gap-3 font-hud text-white/70 font-bold tracking-[0.25em]" style={{ fontSize: 'clamp(11px, min(0.9vw, 1.7vh), 18px)' }}>
                      <span>START</span>
                      <div className="flex-1 track-dash"></div>
                      <span>FINISH</span>
                    </div></div>
                  </div>
                </div>
              </div>

            </div>
          )}

          {/* ===== 賽事設定：選 2～10 組桌號 ===== */}
          {view === 'setup' && (
            <FitStage width={1240} className="pg-enter">
              <TitleBlock />
              <RetroWindow title="Race_Setup.exe" right={serverBadge} className="max-w-6xl">
                <div className="bg-[#facc15] border-b-4 border-black px-5 py-3 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <span className="font-black text-black text-2xl">請選擇參賽桌號</span>
                    <span className="ml-3 font-bold text-black text-base">（{MIN_TEAMS}～{MAX_TEAMS} 組，打叉為已比賽）</span>
                  </div>
                  <span className={`px-4 py-1 border-4 border-black font-black text-2xl font-mono ${canCreate ? 'bg-[#22c55e] text-black' : 'bg-black text-[#facc15]'}`}>
                    {selected.length} / {MAX_TEAMS}
                  </span>
                </div>
                <div className="bg-[#38bdf8] p-6">
                  <div className="grid grid-cols-10 gap-3">
                    {Array.from({ length: TOTAL_TABLES }, (_, i) => i + 1).map(t => {
                      const done = raced.includes(t);
                      const on = selected.includes(t);
                      const full = !on && !done && selected.length >= MAX_TEAMS;
                      const armed = unmarkArmed === t;
                      return (
                        <button key={t} data-table={t} data-raced={done ? '1' : undefined} onClick={() => toggleTable(t)} disabled={full}
                          style={{ '--c': Math.floor((t - 1) / 10) + ((t - 1) % 10) }}
                          title={done ? '已比賽（連按兩次可解除）' : undefined}
                          className={`relative h-14 border-4 border-black font-black text-2xl transition-all ${done ? (armed ? 'bg-[#e11d48] text-white' : 'bg-gray-200 text-gray-600') : on ? `${SEL_ON} shadow-[4px_4px_0px_#000] -translate-y-0.5` : full ? 'bg-white/60 text-gray-400 cursor-not-allowed' : `bg-white text-black ${SEL_HOVER} shadow-[2px_2px_0px_#000]`}`}>
                          {armed ? <span className="text-sm">再按解除</span> : pad2(t)}
                          {done && !armed && (
                            <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-80" viewBox="0 0 100 100" preserveAspectRatio="none">
                              <line x1="12" y1="12" x2="88" y2="88" stroke="#e11d48" strokeWidth="3.5" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
                              <line x1="88" y1="12" x2="12" y2="88" stroke="#e11d48" strokeWidth="3.5" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
                            </svg>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
                <div className="bg-white border-t-4 border-black px-5 py-4 flex flex-wrap items-center gap-3 justify-between">
                  <div className="flex flex-wrap gap-2 min-h-[2.5rem] items-center">
                    {selected.length === 0 && <span className="font-bold text-gray-500">尚未選擇桌號</span>}
                    {[...selected].sort((a, b) => a - b).map(t => (
                      <span key={t} className="px-2.5 py-1 bg-[#facc15] border-2 border-black font-black">#{pad2(t)}</span>
                    ))}
                  </div>
                  {/* 按鈕縮窄：選滿 10 組時，桌號標籤仍可和按鈕排在同一列，視窗不會被拉長 */}
                  <div className="flex gap-2 items-center shrink-0">
                    <button data-testid="open-history" onClick={() => setShowHistory(true)} title="查看目前成績" className={`${ghostBtn} !px-4 inline-flex items-center gap-1.5 whitespace-nowrap`}>
                      查看成績
                    </button>
                    {raced.length > 0 && (
                      <ConfirmButton onConfirm={resetRaced} confirmText="再按確認" title="重置參賽紀錄" className={`${dangerBtn} !px-4 inline-flex items-center gap-1.5 whitespace-nowrap min-w-[6.5em] justify-center`}>
                        重置紀錄
                      </ConfirmButton>
                    )}
                    <button onClick={() => setView('home')} className={`${ghostBtn} !px-4 whitespace-nowrap`}>返回</button>
                    <button onClick={() => setSelected([])} className={`${ghostBtn} !px-4 whitespace-nowrap`}>清除</button>
                  </div>
                </div>
              </RetroWindow>
              <button onClick={createRoom} disabled={!canCreate || busy || !user} className={`mt-8 ${bigBtn(canCreate && !busy && !!user)}`}>
                {busy ? '建立中...' : canCreate ? `建立房間（${selected.length} 組）` : `至少選 ${MIN_TEAMS} 組`}
              </button>
            </FitStage>
          )}

          {/* ===== 房間等待畫面 ===== */}
          {view === 'room' && (
            <FitStage width={1360} smooth className={roomExit ? 'room-exit' : ''}>
              {/* 倒數與比賽中隱藏標題，讓賽道畫面放大（方案 D）*/}
              <div className={`race-title ${room && status !== 'lobby' ? 'is-hidden' : ''}`}><div><TitleBlock /></div></div>
              {!room ? (
                <div className="text-white font-black text-2xl animate-pulse">讀取房間中...</div>
              ) : (
                <div className="w-full max-w-7xl flex gap-6 items-stretch z-10">
                  {/* 左：房號 + QR Code */}
                  {status !== 'lobby' ? (
                    <div className="w-80 shrink-0 bg-[#facc15] border-4 border-black rounded-xl shadow-[12px_12px_0px_#000] p-5 flex flex-col items-center">
                      <div className="font-black text-black text-xl">{{ countdown: '準備起跑', racing: '比賽進行中', finished: '比賽結束', aborted: '比賽已中止' }[status]}</div>
                      <div className="mt-4 font-hud font-bold text-black/70 tracking-[0.3em] text-sm">TIME LEFT</div>
                      <div data-testid="race-timer" className={`font-latin text-[120px] leading-none mt-1 ${status === 'racing' && win && win.end - now <= 5000 ? 'text-[#e11d48] animate-pulse' : 'text-black'}`}>
                        {(() => {
                          if (!win) return '30';
                          if (status === 'countdown') return String(RACE_DURATION);
                          if (status === 'racing') return String(Math.max(0, Math.ceil((win.end - now) / 1000))).padStart(2, '0');
                          return '00';
                        })()}
                      </div>
                      <div className="font-hud font-bold text-black tracking-[0.2em] text-sm">SEC</div>
                      <div className="w-full h-1 bg-black my-6"></div>
                      <div className="font-black text-black text-lg">目標分數</div>
                      <div className="font-latin text-6xl text-black">{TARGET_SCORE}</div>
                      <div className="mt-auto w-full bg-black text-[#facc15] font-mono font-black text-center py-2 border-4 border-black">ROOM {roomCode}</div>
                    </div>
                  ) : (
                  <div className="w-80 shrink-0 bg-[#facc15] border-4 border-black rounded-xl shadow-[12px_12px_0px_#000] p-5 flex flex-col items-center">
                    <div className="font-black text-black text-xl mb-1">房間編號</div>
                    <div data-testid="room-code" className="bg-black text-[#facc15] font-mono font-black text-5xl tracking-[0.2em] pl-[0.2em] px-3 py-2 border-4 border-black mb-5">{roomCode}</div>
                    <QRCodeBox text={playerUrl(roomCode)} />
                    <p className="mt-5 font-black text-black text-center leading-snug">手機掃描 QR Code<br />或輸入房間編號加入</p>
                    <div className="mt-auto pt-5 w-full space-y-1 text-sm font-bold text-black">
                      <div className="flex items-center gap-2"><TrafficLight light="red" /> 尚無玩家</div>
                      <div className="flex items-center gap-2"><TrafficLight light="yellow" /> 等待全員準備</div>
                      <div className="flex items-center gap-2"><TrafficLight light="green" /> 準備完成</div>
                    </div>
                  </div>
                  )}

                  {/* 右：十台賽車 */}
                  <RetroWindow title="TSRC_Racing.exe" right={serverBadge} className="flex-1">
                    <div className="bg-[#38bdf8] p-6 relative flex-1">
                      <div className="absolute top-0 right-0 w-16 h-full bg-checkerboard border-l-4 border-black z-0"></div>
                      <div className="absolute top-0 right-16 w-4 h-full bg-[#e11d48] border-l-4 border-black z-0"></div>

                      {/* 倒數與比賽中：賽道區固定保留十隊的高度，不論幾隊畫面大小都一致 */}
                      <div className="race-lanes relative z-10 flex flex-col gap-[14px]" style={{ minHeight: room && status !== 'lobby' ? RACE_LANES_MIN_H : 0 }}>
                        {(room.tables || []).map(t => {
                          const st = teamStatus(room, t);
                          const color = colorHex(room.teams?.[teamKey(t)]?.color);
                          const inRace = status !== 'lobby';
                          const score = status === 'finished' || status === 'aborted' ? (room.teamScores?.[teamKey(t)] ?? sums[t] ?? 0) : (sums[t] || 0);
                          const val = inRace ? Math.min((score / TARGET_SCORE) * 100, 100) : 0;
                          return (
                            <div key={t} data-lane={t} className="flex items-center gap-3">
                              <div className="w-16 h-10 bg-[#facc15] border-4 border-black rounded flex items-center justify-center shadow-[3px_3px_0px_#000] z-20 shrink-0">
                                <span className="font-black text-xl text-black">#{pad2(t)}</span>
                              </div>
                              <TrafficLight light={st.light} />
                              <div className="flex-1 h-10 bg-white border-4 border-black rounded-r-full relative shadow-[inset_0px_4px_0px_rgba(0,0,0,0.1)]">
                                {inRace && (
                                  /* 進度條：使用隊長選的賽車顏色，不加黑色外框 */
                                  <div className="h-full transition-all duration-300 ease-out rounded-r-full" style={{ width: `${Math.max(val, 5)}%`, background: color }}></div>
                                )}
                                <div data-lane-text={t} className={`absolute top-1/2 -translate-y-1/2 font-black text-black whitespace-nowrap ${inRace ? 'right-6 text-lg' : 'left-20 text-sm'}`}>
                                  {inRace ? `${score} 分` : st.count === 0 ? '等待加入...' : `${st.count} 人・已準備 ${st.ready}/${st.count}`}
                                </div>
                                {/* 比賽進行中、還沒到終點的車子輪子會轉動 */}
                                <div className={`absolute top-1/2 -translate-y-1/2 z-30 transition-all duration-300 ease-out ${status === 'racing' && val < 100 ? 'race-wheels' : ''}`} style={{ left: `calc(${val}% - 15px)`, width: '60px', height: '35px' }}>
                                  <F1CarSVG color={color} />
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </RetroWindow>
                </div>
              )}

              {room && status === 'lobby' && (
                <div className="mt-8 flex items-center gap-6 z-10">
                  <ConfirmButton onConfirm={() => closeRoom('setup', true)} confirmText="再按一次確認取消" className={dangerBtn}>取消房間・回到選桌</ConfirmButton>
                  <button onClick={startRace} disabled={!allGreen || !connected} data-testid="start-race" className={bigBtn(allGreen && connected)}>
                    {allGreen ? '開始比賽' : '全部綠燈後開放開始'}
                  </button>
                </div>
              )}
              {room && (status === 'countdown' || status === 'racing') && (
                <div className="mt-8 flex items-center gap-6 z-10">
                  <ConfirmButton onConfirm={abortRace} confirmText="再按一次確認中止" className={dangerBtn}>緊急中止比賽</ConfirmButton>
                </div>
              )}
            </FitStage>
          )}

          {showHistory && <ScoreHistory history={history} onClose={() => setShowHistory(false)} onClear={clearHistory} />}

          {/* 3、2、1、GO 倒數 */}
          {view === 'room' && win && (status === 'countdown' || (status === 'racing' && now < win.start + 1000)) && (() => {
            const left = win.start - now;
            const label = left > 0 ? String(Math.min(3, Math.ceil(left / 1000))) : 'GO!';
            return (
              <div className="absolute inset-0 z-50 bg-black/45 flex items-center justify-center pointer-events-none">
                <div key={label} data-testid="countdown" className={`count-pop font-latin leading-none ${label === 'GO!' ? 'text-[#22c55e]' : 'text-white'}`}
                  style={{ fontSize: 'min(34vw, 60vh)', WebkitTextStroke: '0.02em #000' }}>{label}</div>
              </div>
            );
          })()}

          {/* 比賽結束／中止（完整排名於第五階段加入）*/}
          {view === 'room' && room && (status === 'finished' || status === 'aborted') && (() => {
            const ranking = room.result?.ranking || [];
            const top = ranking.filter(r => r.rank === 1 && r.score > 0);
            const aborted = status === 'aborted';
            return (
              <div className={`absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 ${roomExit ? 'room-exit' : ''}`}>
                <div data-testid="result-card" className="bg-[#facc15] border-8 border-black p-10 max-w-2xl w-full text-center shadow-[16px_16px_0px_#e11d48]">
                  {aborted ? (
                    <h2 className="font-winner text-7xl text-black mb-4">STOPPED</h2>
                  ) : (
                    <>
                      <div className="flex justify-center mb-4"><TrophyIcon /></div>
                      <h2 className="font-winner text-8xl text-black mb-4">WINNER!</h2>
                    </>
                  )}
                  <div className="inline-block bg-black text-white font-black px-4 py-1 mb-5">結束原因：{END_REASON_TEXT[room.meta?.endReason] || '—'}</div>
                  {!aborted && (
                    <div className="bg-white border-4 border-black p-4 mb-6 shadow-[6px_6px_0px_#000]">
                      {top.length ? (
                        <p className="text-4xl font-black text-black">第 <span className="text-[#e11d48] text-6xl">{top.map(r => pad2(r.table)).join('、')}</span> 桌{top.length > 1 ? '（並列）' : ''}<span className="block text-2xl mt-2">{top[0].score} 分</span></p>
                      ) : <p className="text-3xl font-black text-black">本場無人得分</p>}
                    </div>
                  )}
                  <div className="flex justify-center gap-4">
                    <ConfirmButton onConfirm={resetRace} confirmText="再按一次確認重賽" className={ghostBtn} armedClass={BTN_ARMED_NEUTRAL}>同組重新比賽</ConfirmButton>
                    <ConfirmButton onConfirm={() => closeRoom('setup')} confirmText="再按一次確認結束" className={dangerBtn}>結束本場・選擇下一輪</ConfirmButton>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
