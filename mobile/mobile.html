<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>綠能方程式 - Player UI</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 設定 Firebase 的 Import Map -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Righteous&display=swap');
    body { 
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0; padding: 0;
      overscroll-behavior-y: contain; 
      touch-action: manipulation; 
    }
    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.15) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(255,255,255,0.15) 2px, transparent 2px);
    }
    .retro-shadow { box-shadow: 6px 6px 0px #000; }
    .retro-shadow-sm { box-shadow: 3px 3px 0px #000; }
    .retro-text-shadow { text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
    
    @keyframes floatUp {
      0% { transform: translateY(150px) scale(0.5); opacity: 0; }
      15% { opacity: 1; transform: translateY(0) scale(1); }
      85% { opacity: 1; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }
    .bubble-anim { animation: floatUp linear forwards; }

    @keyframes popScore {
      0% { transform: scale(0.5) rotate(-15deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(10deg); opacity: 1; }
      100% { transform: scale(2) translateY(-20px); opacity: 0; }
    }
    .score-pop {
      animation: popScore 0.6s ease-out forwards;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 使用 module 模式來支援 ES6 Imports -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from 'firebase/firestore';

    const { useState, useEffect } = React;

    // --- Firebase 初始化區塊 ---
    // 未來部署到 Github Pages 時，請將下方的 JSON.parse 區塊替換成您自己的 Firebase Config 結構
    const getFirebaseConfig = () => {
      if (typeof __firebase_config !== 'undefined') return JSON.parse(__firebase_config);
      return {
       apiKey: "AIzaSyAVKXL-r-MM2NSs9f6T9LPX70b-CAgCXQY",
       authDomain: "tsrc-racing.firebaseapp.com",
       projectId: "tsrc-racing",
       storageBucket: "tsrc-racing.firebasestorage.app",
       messagingSenderId: "859095220602",
       appId: "1:859095220602:web:70c4d9be106383a97656c3",
       measurementId: "G-1RLXCDE731"
      };
    };
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'tsrc-game-default';
    
    const firebaseConfig = getFirebaseConfig();
    const isFirebaseConfigured = Object.keys(firebaseConfig).length > 0;

    let app, auth, db;
    if (isFirebaseConfigured) {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    }

    // --- UI 元件 ---
    const TrophyIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="#facc15" stroke="#000" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
    );

    const BUBBLE_TYPES = [
      { text: '低滾動阻力', color: 'bg-[#38bdf8]' },
      { text: '耐磨', color: 'bg-[#f472b6]' },
      { text: '濕地抓地力', color: 'bg-[#22c55e]' },
    ];

    const MobileApp = () => {
      const [user, setUser] = useState(null);
      const [hasSelectedTable, setHasSelectedTable] = useState(false);
      const [tableNumber, setTableNumber] = useState(1);
      const [errorMsg, setErrorMsg] = useState('');
      
      const [isPlaying, setIsPlaying] = useState(false);
      const [score, setScore] = useState(0);
      const [bubbles, setBubbles] = useState([]);
      const [pops, setPops] = useState([]);

      // 1. 處理身份驗證
      useEffect(() => {
        if (!isFirebaseConfigured) {
          setUser({ uid: 'mock-local-user' });
          return;
        }

        const initAuth = async () => {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      // 2. 監聽大螢幕的遊戲狀態
      useEffect(() => {
        if (!user) return;
        
        if (!isFirebaseConfigured) {
          // 本地測試模式：無 Firebase 時，綁定桌次後自動進入遊戲
          if (hasSelectedTable) setIsPlaying(true);
          return;
        }

        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'game', 'state');
        const unsubscribe = onSnapshot(docRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            // 根據主畫面狀態切換
            setIsPlaying(data.status === 'playing');
            
            // 如果已綁定桌次，同步目前分數
            if (hasSelectedTable && data.scores) {
              setScore(data.scores[tableNumber] || 0);
            }
          }
        }, (error) => console.error("Firebase 監聽失敗", error));
        
        return () => unsubscribe();
      }, [user, hasSelectedTable, tableNumber]);

      // 3. 遊戲進行中的泡泡生成邏輯
      useEffect(() => {
        if (!isPlaying) {
          setBubbles([]); // 遊戲停止時清空泡泡
          return;
        }

        const spawnBubble = () => {
          const type = BUBBLE_TYPES[Math.floor(Math.random() * BUBBLE_TYPES.length)];
          const id = Date.now() + Math.random();
          const left = Math.max(10, Math.min(70, Math.random() * 80));
          const duration = 4 + Math.random() * 2; // 稍微加快一點節奏

          setBubbles(prev => [...prev, { id, ...type, left, duration }]);
          setTimeout(() => {
            setBubbles(prev => prev.filter(b => b.id !== id));
          }, duration * 1000);
        };

        spawnBubble();
        const interval = setInterval(spawnBubble, 800);
        return () => clearInterval(interval);
      }, [isPlaying]);

      // 4. 點擊泡泡並將分數送往 Firebase
      const handlePop = async (e, bubble) => {
        e.stopPropagation();
        if (navigator.vibrate) navigator.vibrate(50);
        
        // 視覺特效與本地即時加分 (提升手感)
        setScore(s => s + 10);
        const rect = e.currentTarget.getBoundingClientRect();
        setPops(prev => [...prev, { id: Date.now(), x: rect.left + rect.width / 2, y: rect.top }]);
        setBubbles(prev => prev.filter(b => b.id !== bubble.id));
        setTimeout(() => setPops(prev => prev.slice(1)), 600);

        // 將分數同步到 Firebase
        if (isFirebaseConfigured && user && hasSelectedTable) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'game', 'state');
            await updateDoc(docRef, {
              [`scores.${tableNumber}`]: increment(10)
            });
          } catch (err) {
            console.error("更新分數失敗:", err);
          }
        }
      };

      return (
        <div className="w-full h-[100dvh] bg-[#1e3a8a] flex flex-col relative overflow-hidden">
          <div className="absolute inset-0 bg-grid z-0 pointer-events-none"></div>

          {/* 頂部導覽列 */}
          <div className="w-full bg-white border-b-4 border-black p-3 flex justify-between items-center z-20 shrink-0 relative">
            <div className="flex gap-2">
              <div className="w-4 h-4 rounded-full bg-[#e11d48] border-2 border-black"></div>
              <div className="w-4 h-4 rounded-full bg-[#facc15] border-2 border-black"></div>
              <div className="w-4 h-4 rounded-full bg-[#22c55e] border-2 border-black"></div>
            </div>
            <span className="font-black text-black text-lg tracking-wider font-['Righteous'] uppercase">Player_UI.exe</span>
            <div className="w-10">
              <div className={`w-3 h-3 rounded-full border-2 border-black ml-auto ${user ? 'bg-green-500' : 'bg-red-500'}`}></div>
            </div>
          </div>

          {/* 狀態列 */}
          <div className="p-4 z-20 shrink-0 relative">
            <div className="bg-[#facc15] border-4 border-black retro-shadow p-3 flex justify-between items-end transform -rotate-1 relative">
              <div className="bg-white border-4 border-black px-3 py-1">
                <span className="font-black text-xl">第 {tableNumber} 桌</span>
              </div>
              <div className="text-right">
                <div className="font-black text-sm mb-1 font-['Righteous']">SCORE</div>
                <div className="bg-white border-4 border-black rounded-full px-4 py-1 inline-block">
                  <span className="font-black text-2xl italic">{score}</span>
                </div>
              </div>
            </div>
          </div>

          {/* 遊戲互動區 */}
          <div className="flex-1 relative z-10 touch-none">
            
            {/* 步驟1: 綁定桌次 */}
            {!hasSelectedTable && (
              <div className="absolute inset-0 flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm z-50">
                <div className="bg-[#f472b6] border-4 border-black retro-shadow p-6 text-center transform -rotate-2 w-full max-w-sm">
                  <h2 className="text-3xl font-black text-white mb-6 retro-text-shadow tracking-widest">綁定所屬車隊</h2>
                  <div className="bg-[#38bdf8] border-4 border-black p-4 mb-4 retro-shadow-sm">
                    <label className="block text-black font-black mb-3 text-lg">請輸入桌次號碼 (1-10)：</label>
                    <input type="number" pattern="\d*" min="1" max="10" value={tableNumber} onChange={(e) => {
                      const val = e.target.value;
                      setTableNumber(val === '' ? '' : Number(val));
                      setErrorMsg('');
                    }} className="w-full text-center text-6xl font-black italic p-2 border-4 border-black bg-white focus:outline-none focus:bg-[#facc15] transition-colors" />
                  </div>
                  {errorMsg && <p className="text-black font-black mb-4 bg-white border-2 border-black inline-block px-3 py-1">{errorMsg}</p>}
                  
                  <button onClick={() => {
                    if(tableNumber >= 1 && tableNumber <= 10) setHasSelectedTable(true);
                    else setErrorMsg("⚠️ 賽道僅限 1~10 桌");
                  }} className="w-full bg-[#22c55e] text-white border-4 border-black rounded-full py-4 font-black text-2xl flex items-center justify-center gap-2 retro-shadow active:translate-y-[6px] active:shadow-none transition-all">
                    確認綁定
                  </button>
                </div>
              </div>
            )}

            {/* 步驟2: 等待主畫面開始 */}
            {hasSelectedTable && !isPlaying && (
              <div className="absolute inset-0 flex items-center justify-center p-6 bg-black/40 backdrop-blur-sm z-40">
                <div className="bg-[#38bdf8] border-4 border-black retro-shadow p-6 text-center transform rotate-1 w-full max-w-sm">
                  <div className="bg-white border-4 border-black rounded-full w-24 h-24 mx-auto flex items-center justify-center mb-4 retro-shadow-sm">
                    <TrophyIcon />
                  </div>
                  <h2 className="text-3xl font-black text-white mb-2 retro-text-shadow">賽車手集結！</h2>
                  <div className="h-1 bg-black w-full my-4"></div>
                  <p className="font-black text-black text-xl mb-6 animate-pulse">等待大螢幕指示開始...</p>
                </div>
              </div>
            )}

            {/* 遊戲進行中：泡泡物件 */}
            {bubbles.map(bubble => (
              <div key={bubble.id} onClick={(e) => handlePop(e, bubble)} className={`absolute bottom-0 w-24 h-24 ${bubble.color} border-4 border-black rounded-full flex items-center justify-center p-2 cursor-pointer shadow-[inset_-4px_-4px_0px_rgba(0,0,0,0.2)] retro-shadow-sm bubble-anim active:scale-95`} style={{ left: `${bubble.left}%`, animationDuration: `${bubble.duration}s` }}>
                <span className="font-black text-black text-center text-sm leading-tight">{bubble.text}</span>
                <div className="absolute top-2 left-2 w-4 h-4 bg-white rounded-full opacity-60 pointer-events-none"></div>
              </div>
            ))}

            {/* 點擊特效 */}
            {pops.map(pop => (
              <div key={pop.id} className="absolute z-50 pointer-events-none score-pop" style={{ left: pop.x - 20, top: pop.y - 20 }}>
                <span className="text-3xl font-black italic text-[#facc15]">+10</span>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MobileApp />);
  </script>
</body>
</html>
