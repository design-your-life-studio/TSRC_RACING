<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台橡綠能方程式 - 手機控制器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <style>
        body { background-color: #111; color: #fff; overflow: hidden; touch-action: manipulation; }
        .bubble { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; user-select: none; animation: floatUp 3s linear forwards; box-shadow: 0 0 15px currentColor; }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }
        .pop-effect { animation: pop 0.2s ease-out forwards; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(0); opacity: 0; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 幫您填入的 TSRC RACING Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyAVkXL-r-MM2NSs9f6T9LPX78b-CAgCXQY",
            authDomain: "tsrc-racing.firebaseapp.com",
            projectId: "tsrc-racing",
            storageBucket: "tsrc-racing.firebasestorage.app",
            messagingSenderId: "859095220602",
            appId: "1:859095220602:web:70c4d9be106383a97656c3",
            measurementId: "G-1RLXCDE731"
        };

        window.firebaseApp = initializeApp(firebaseConfig);
        window.db = getFirestore(window.firebaseApp);
        window.auth = getAuth(window.firebaseApp);
        window.firebaseModules = { doc, onSnapshot, getDoc, updateDoc, signInAnonymously };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const KEYWORDS = ["低滾動阻力", "耐磨", "濕地抓地力", "綠能", "ESG"];
        const COLORS = ["#10b981", "#3b82f6", "#8b5cf6", "#f59e0b", "#ec4899"];

        function MobileController() {
            const [tableNum, setTableNum] = useState("");
            const [isBound, setIsBound] = useState(false);
            const [gameState, setGameState] = useState("waiting");
            const [bubbles, setBubbles] = useState([]);
            const bubbleIdCounter = useRef(0);

            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.db) return setTimeout(initFirebase, 100);
                    const { doc, onSnapshot, signInAnonymously } = window.firebaseModules;
                    
                    try {
                        await signInAnonymously(window.auth);
                        console.log("手機端：已匿名登入 Firebase");
                        
                        onSnapshot(doc(window.db, "game", "state"), (docSnap) => {
                            if (docSnap.exists()) {
                                setGameState(docSnap.data().status);
                            }
                        });
                    } catch (error) {
                        console.error("Firebase 連線錯誤:", error);
                    }
                };
                initFirebase();
            }, []);

            useEffect(() => {
                let interval;
                if (isBound && gameState === "playing") {
                    interval = setInterval(() => {
                        createBubble();
                    }, 600); // 泡泡產生速度
                } else {
                    setBubbles([]);
                }
                return () => clearInterval(interval);
            }, [isBound, gameState]);

            const createBubble = () => {
                const id = bubbleIdCounter.current++;
                const size = Math.random() * 40 + 70; // 70px ~ 110px
                const left = Math.random() * 80 + 10; // 10% ~ 90%
                const keyword = KEYWORDS[Math.floor(Math.random() * KEYWORDS.length)];
                const color = COLORS[Math.floor(Math.random() * COLORS.length)];

                setBubbles(prev => [...prev, { id, size, left, keyword, color, popped: false }]);

                // 3秒後自動移除未點擊的泡泡
                setTimeout(() => {
                    setBubbles(prev => prev.filter(b => b.id !== id));
                }, 3000);
            };

            const handlePop = async (id) => {
                setBubbles(prev => prev.map(b => b.id === id ? { ...b, popped: true } : b));
                
                // 播放震動回饋 (如果手機支援)
                if (navigator.vibrate) navigator.vibrate(50);

                // 將分數寫入 Firebase
                if (window.db && isBound) {
                    const { doc, getDoc, updateDoc } = window.firebaseModules;
                    const gameRef = doc(window.db, "game", "state");
                    try {
                        const snap = await getDoc(gameRef);
                        if (snap.exists()) {
                            let currentScores = snap.data().scores;
                            const tIndex = parseInt(tableNum) - 1;
                            if(tIndex >= 0 && tIndex < 10) {
                                currentScores[tIndex] += 10; // 每戳破一個+10分
                                await updateDoc(gameRef, { scores: currentScores });
                            }
                        }
                    } catch(e) {
                        console.error("加分失敗:", e);
                    }
                }

                setTimeout(() => {
                    setBubbles(prev => prev.filter(b => b.id !== id));
                }, 200);
            };

            if (!isBound) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-b from-gray-900 to-black">
                        <h1 className="text-3xl font-bold text-emerald-400 mb-8">車手報到</h1>
                        <input 
                            type="number" 
                            min="1" max="10"
                            placeholder="請輸入桌號 (1-10)" 
                            className="w-full p-4 rounded-xl bg-gray-800 text-white text-center text-2xl border-2 border-emerald-500 mb-6 focus:outline-none focus:ring-4 focus:ring-emerald-500/50"
                            value={tableNum}
                            onChange={(e) => setTableNum(e.target.value)}
                        />
                        <button 
                            onClick={() => {
                                if(tableNum >= 1 && tableNum <= 10) setIsBound(true);
                                else alert("請輸入 1 到 10 的有效桌號！");
                            }}
                            className="w-full bg-emerald-500 text-white font-bold py-4 rounded-xl text-xl shadow-[0_0_15px_rgba(16,185,129,0.4)]"
                        >
                            加入車隊綁定桌號
                        </button>
                    </div>
                );
            }

            return (
                <div className="h-screen w-full relative overflow-hidden bg-gray-900">
                    <div className="absolute top-4 w-full text-center z-10 text-gray-400">
                        目前身分：<span className="text-emerald-400 font-bold">第 {tableNum} 桌</span>
                    </div>

                    {gameState === "waiting" && (
                        <div className="absolute inset-0 flex items-center justify-center z-20 bg-black/60 backdrop-blur-sm">
                            <h2 className="text-2xl font-bold text-white animate-pulse">等待大螢幕指示開始...</h2>
                        </div>
                    )}
                    
                    {gameState === "finished" && (
                        <div className="absolute inset-0 flex items-center justify-center z-20 bg-black/80">
                            <h2 className="text-3xl font-bold text-emerald-400">比賽結束！請看大螢幕</h2>
                        </div>
                    )}

                    {bubbles.map(b => (
                        <div 
                            key={b.id}
                            className={`bubble ${b.popped ? 'pop-effect' : ''}`}
                            style={{
                                width: b.size,
                                height: b.size,
                                left: `${b.left}%`,
                                backgroundColor: `${b.color}22`,
                                border: `2px solid ${b.color}`,
                                color: b.color
                            }}
                            onPointerDown={() => !b.popped && handlePop(b.id)}
                        >
                            <span className="text-sm">{b.keyword}</span>
                        </div>
                    ))}
                </div>
            );
        }

        ReactDOM.render(<MobileController />, document.getElementById('root'));
    </script>
</body>
</html>
