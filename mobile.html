<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>綠能方程式 - Player UI</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 設定 Firebase 的 Import Map -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js"
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Righteous&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0; padding: 0;
      overscroll-behavior-y: contain;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    /* 背景：低對比藍色賽車格紋 */
    .bg-grid {
      background-color: #1e3a8a;
      background-image: conic-gradient(rgba(255,255,255,0.06) 25%, transparent 0 50%, rgba(255,255,255,0.06) 0 75%, transparent 0);
      background-size: 88px 88px;
    }
    .retro-shadow { box-shadow: 6px 6px 0px #000; }
    .retro-shadow-sm { box-shadow: 3px 3px 0px #000; }
    .retro-text-shadow { text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
    /* ===== 標題字：簡單白色黑體 ===== */
    .logo-plain { font-family: 'Noto Sans TC', sans-serif; font-weight: 900; font-style: normal; color: #fff; letter-spacing: 0.04em; line-height: 1.12; text-align: center; display: inline-block; }
    .retro-title-m { text-shadow: 3px 3px 0px #e11d48, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    @keyframes floatUp {
      0% { transform: translateY(150px) scale(0.5); opacity: 0; }
      15% { opacity: 1; transform: translateY(0) scale(1); }
      85% { opacity: 1; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }
    .bubble-anim { animation: floatUp linear forwards; }

    @keyframes popScore {
      0% { transform: scale(0.5) rotate(-15deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(10deg); opacity: 1; }
      100% { transform: scale(2) translateY(-20px); opacity: 0; }
    }
    .score-pop {
      animation: popScore 0.6s ease-out forwards;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    }
    .bulb-on-red { background: #ef4444; box-shadow: 0 0 8px 1px #ef4444; }
    .bulb-on-yellow { background: #facc15; box-shadow: 0 0 8px 1px #facc15; }
    .bulb-on-green { background: #22c55e; box-shadow: 0 0 8px 1px #22c55e; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
    import { getDatabase, ref, get, onValue } from 'firebase/database';

    const { useState, useEffect } = React;

    // ================= 遊戲設定（需與 index.html 一致）=================
    const POINTS_PER_BUBBLE = 10;   // 原始得分邏輯：戳破一顆 +10（第四階段使用）
    const CAR_COLORS = [
      { id: 'red',    hex: '#e11d48', name: '賽道紅' },
      { id: 'blue',   hex: '#3b82f6', name: '極速藍' },
      { id: 'green',  hex: '#22c55e', name: '綠能綠' },
      { id: 'yellow', hex: '#facc15', name: '閃電黃' },
      { id: 'pink',   hex: '#f472b6', name: '霓虹粉' },
      { id: 'orange', hex: '#f97316', name: '烈焰橘' },
      { id: 'purple', hex: '#a855f7', name: '電光紫' },
      { id: 'cyan',   hex: '#38bdf8', name: '天際藍' },
      { id: 'lime',   hex: '#a3e635', name: '萊姆綠' },
      { id: 'black',  hex: '#334155', name: '碳纖黑' },
    ];
    // 原始遊戲的三種泡泡（第四階段使用）
    const BUBBLE_TYPES = [
      { text: '低滾動阻力', color: 'bg-[#38bdf8]' },
      { text: '耐磨', color: 'bg-[#f472b6]' },
      { text: '濕地抓地力', color: 'bg-[#22c55e]' },
    ];

    // ================= Firebase =================
    const firebaseConfig = {
      apiKey: "AIzaSyAVKXL-r-MM2NSs9f6T9LPX70b-CAgCXQY",
      authDomain: "tsrc-racing.firebaseapp.com",
      // 注意：請到 Firebase 主控台 → Realtime Database 複製實際網址貼在這裡（需與 index.html 相同）
      databaseURL: "https://tsrc-racing-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tsrc-racing",
      storageBucket: "tsrc-racing.firebasestorage.app",
      messagingSenderId: "859095220602",
      appId: "1:859095220602:web:70c4d9be106383a97656c3",
      measurementId: "G-1RLXCDE731"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // ================= 工具 =================
    const pad2 = (n) => String(n).padStart(2, '0');
    const teamKey = (t) => `t${t}`;
    const colorHex = (id) => (CAR_COLORS.find(c => c.id === id) || CAR_COLORS[1]).hex;
    const teamStatus = (room, t) => {
      const players = Object.values(room?.players?.[teamKey(t)] || {}).filter(p => p && p.online);
      if (!players.length) return { light: 'red', count: 0, ready: 0 };
      const ready = players.filter(p => p.ready).length;
      return { light: ready === players.length ? 'green' : 'yellow', count: players.length, ready };
    };
    const urlRoom = (() => {
      const v = new URLSearchParams(location.search).get('room') || '';
      return /^\d{6}$/.test(v) ? v : '';
    })();

    // ================= UI 元件 =================
    const F1CarSVG = ({ color = '#3b82f6' }) => (
      <svg viewBox="0 0 120 45" className="w-full h-full drop-shadow-md">
        <g stroke="#000" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round">
          <path d="M10,35 L110,35 L115,25 L105,25 Z" fill="#1e3a8a" />
          <path d="M5,15 L25,15 L25,25 L5,25 Z" fill="#e11d48" />
          <path d="M10,5 L15,5 L15,35 L10,35 Z" fill="#000" />
          <path d="M25,25 L45,15 L75,15 L100,25 Z" fill={color} />
          <path d="M55,15 C55,5 70,5 70,15 Z" fill="#fff" />
          <path d="M40,25 L65,25 L65,30 L40,30 Z" fill="#22c55e" />
          <path d="M105,30 L115,30 L115,35 L105,35 Z" fill="#e11d48" />
          <circle cx="25" cy="30" r="12" fill="#1f2937" />
          <circle cx="25" cy="30" r="6" fill="#facc15" />
          <circle cx="25" cy="30" r="2" fill="#000" />
          <circle cx="90" cy="30" r="12" fill="#1f2937" />
          <circle cx="90" cy="30" r="6" fill="#facc15" />
          <circle cx="90" cy="30" r="2" fill="#000" />
          <circle cx="50" cy="20" r="6" fill="#fff" />
        </g>
      </svg>
    );

    // 標題字元件：簡單白色黑體，無任何特效
    const LogoText = ({ children }) => <span className="logo-plain">{children}</span>;

    const TrafficLight = ({ light }) => (
      <div className="flex gap-1 bg-black rounded-full px-1 py-0.5 shrink-0">
        {['red', 'yellow', 'green'].map(c => (
          <div key={c} className={`w-3 h-3 rounded-full ${light === c ? `bulb-on-${c}` : 'bg-gray-600'}`}></div>
        ))}
      </div>
    );

    const bigBtn = (color = 'bg-[#22c55e]', enabled = true) => `w-full ${enabled ? `${color} text-white retro-shadow active:translate-y-[6px] active:shadow-none` : 'bg-gray-400 text-gray-700'} border-4 border-black rounded-full py-4 font-black text-2xl flex items-center justify-center gap-2 transition-all`;

    // ================= 主程式 =================
    const MobileApp = () => {
      const [user, setUser] = useState(null);
      const [connected, setConnected] = useState(false);
      const [view, setView] = useState('home'); // home | join | room
      const [code, setCode] = useState(urlRoom);
      const [roomCode, setRoomCode] = useState(null);
      const [room, setRoom] = useState(null);
      const [checking, setChecking] = useState(false);
      const [error, setError] = useState('');

      // 1. 匿名登入 + 連線狀態（Firebase SDK 會自動斷線重連）
      useEffect(() => {
        signInAnonymously(auth).catch(err => { console.error(err); setError('登入失敗，請檢查網路後重新整理'); });
        const unAuth = onAuthStateChanged(auth, setUser);
        const unConn = onValue(ref(db, '.info/connected'), s => setConnected(s.val() === true));
        return () => { unAuth(); unConn(); };
      }, []);

      // 2. 已進入房間：即時監聽房間資料；房間被關閉時退回輸入畫面
      useEffect(() => {
        if (!roomCode) { setRoom(null); return; }
        return onValue(ref(db, `rooms/${roomCode}`), s => {
          const data = s.val();
          if (!data || data.meta?.status === 'closed') {
            setRoomCode(null);
            setView('join');
            setError('房間已被主控端關閉，請輸入新的房間編號');
            return;
          }
          setRoom(data);
        }, err => console.error(err));
      }, [roomCode]);

      // 3. 驗證房間是否存在、是否開放加入
      const joinRoom = async () => {
        const c = code.trim();
        if (!/^\d{6}$/.test(c)) { setError('請輸入 6 位數房間編號'); return; }
        if (!user) { setError('連線中，請稍候再試'); return; }
        setChecking(true); setError('');
        try {
          const m = (await get(ref(db, `rooms/${c}/meta`))).val();
          if (!m) setError('查無此房間，請確認編號');
          else if (m.status === 'closed') setError('此房間已關閉');
          else if (m.status !== 'lobby') setError('比賽已經開始，目前無法加入');
          else { setRoomCode(c); setView('room'); }
        } catch (err) {
          console.error(err);
          setError('連線失敗，請檢查網路後再試');
        } finally {
          setChecking(false);
        }
      };

      const goHome = () => { setRoomCode(null); setRoom(null); setError(''); setView('home'); };

      return (
        <div className="w-full min-h-[100dvh] bg-[#1e3a8a] flex flex-col relative overflow-hidden">
          <div className="absolute inset-0 bg-grid z-0 pointer-events-none"></div>

          {/* 頂部導覽列 */}
          <div className="w-full bg-white border-b-4 border-black p-3 flex justify-between items-center z-20 shrink-0 relative">
            <div className="flex gap-2">
              <div className="w-4 h-4 rounded-full bg-[#e11d48] border-2 border-black"></div>
              <div className="w-4 h-4 rounded-full bg-[#facc15] border-2 border-black"></div>
              <div className="w-4 h-4 rounded-full bg-[#22c55e] border-2 border-black"></div>
            </div>
            <span className="font-black text-black text-lg tracking-wider font-['Righteous'] uppercase">Player_UI.exe</span>
            <div className="w-10">
              <div className={`w-3 h-3 rounded-full border-2 border-black ml-auto ${connected ? 'bg-green-500' : 'bg-red-500 animate-pulse'}`}></div>
            </div>
          </div>
          {!connected && user && (
            <div className="z-30 bg-[#e11d48] text-white font-black text-center text-sm py-1 border-b-4 border-black">連線中斷，正在重新連線...</div>
          )}

          <div className="flex-1 flex flex-col z-10 relative">

            {/* ===== 手機首頁 ===== */}
            {view === 'home' && (
              <div className="flex-1 flex flex-col items-center justify-center px-6 py-8 text-center">
                <div className="bg-[#facc15] border-4 border-black retro-shadow px-4 py-1 mb-4">
                  <span className="font-medium text-black text-base tracking-wider">解鎖你的 2027 冠軍賽道</span>
                </div>
                <h1 className="text-[68px] mb-8"><LogoText>綠能<br />方程式</LogoText></h1>
                <div className="w-56 h-24 mb-10 -rotate-3"><F1CarSVG color="#e11d48" /></div>
                <div className="w-full max-w-[220px]">
                  <button onClick={() => { setError(''); setView('join'); }} className={`${bigBtn('bg-[#e11d48]')} !py-3 !text-xl`}>
                    ▶ 開始遊戲
                  </button>
                </div>
                <p className="mt-8 text-white/80 font-bold text-sm">請看大螢幕上的房間編號或掃描 QR Code</p>
              </div>
            )}

            {/* ===== 輸入房間編號 ===== */}
            {view === 'join' && (
              <div className="flex-1 flex items-center justify-center p-6">
                <div className="bg-[#f472b6] border-4 border-black retro-shadow p-6 text-center transform -rotate-1 w-full max-w-sm">
                  <h2 className="text-3xl font-black text-white mb-6 retro-text-shadow tracking-widest">加入賽事房間</h2>
                  <div className="bg-[#38bdf8] border-4 border-black p-4 mb-4 retro-shadow-sm">
                    <label className="block text-black font-black mb-3 text-lg">請輸入 6 位數房間編號</label>
                    <input type="text" inputMode="numeric" autoComplete="off" pattern="\d*" maxLength={6} value={code}
                      onChange={(e) => { setCode(e.target.value.replace(/\D/g, '').slice(0, 6)); setError(''); }}
                      onKeyDown={(e) => { if (e.key === 'Enter') joinRoom(); }}
                      placeholder="000000"
                      className="w-full text-center text-5xl font-black font-mono tracking-[0.15em] p-2 border-4 border-black bg-white placeholder:text-gray-300 focus:outline-none focus:bg-[#facc15] transition-colors" />
                  </div>
                  {error && <p data-testid="join-error" className="text-black font-black mb-4 bg-white border-2 border-black inline-block px-3 py-1">{error}</p>}
                  <button onClick={joinRoom} disabled={checking} className={bigBtn('bg-[#22c55e]', !checking)}>
                    {checking ? '驗證中...' : '加入房間'}
                  </button>
                  <button onClick={goHome} className="mt-4 font-black text-black underline">返回首頁</button>
                </div>
              </div>
            )}

            {/* ===== 已進入房間（第三階段將加入選桌、組長、顏色）===== */}
            {view === 'room' && (
              <div className="flex-1 flex flex-col p-4 gap-4">
                <div className="bg-[#facc15] border-4 border-black retro-shadow p-3 flex justify-between items-center -rotate-1">
                  <div>
                    <div className="font-black text-xs">ROOM</div>
                    <div data-testid="joined-room" className="font-black font-mono text-2xl tracking-widest">{roomCode}</div>
                  </div>
                  <span className="bg-white border-4 border-black px-3 py-1 font-black">選擇你的車隊</span>
                </div>

                {!room ? (
                  <div className="text-white font-black text-center animate-pulse mt-10">讀取房間中...</div>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    {(room.tables || []).map(t => {
                      const st = teamStatus(room, t);
                      return (
                        <div key={t} data-card={t} className="bg-white border-4 border-black retro-shadow-sm p-3 flex flex-col items-center">
                          <div className="w-full flex justify-between items-center mb-1">
                            <span className="font-black text-xl">第 {pad2(t)} 桌</span>
                            <TrafficLight light={st.light} />
                          </div>
                          <div className="w-24 h-10 my-1"><F1CarSVG color={colorHex(room.teams?.[teamKey(t)]?.color)} /></div>
                          <div className="font-bold text-sm">{st.count} 人加入</div>
                        </div>
                      );
                    })}
                  </div>
                )}

                <p className="text-center text-white/70 font-bold text-xs">（開發中：選桌、組長與顏色功能將於第三階段加入）</p>
                <button onClick={goHome} className="mx-auto font-black text-white underline">離開房間</button>
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MobileApp />);
  </script>
</body>
</html>
