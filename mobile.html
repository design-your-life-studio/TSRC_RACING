<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>綠能方程式 - Player UI</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 設定 Firebase 的 Import Map -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Righteous&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0; padding: 0;
      overscroll-behavior-y: contain;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .bg-grid {
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.15) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(255,255,255,0.15) 2px, transparent 2px);
    }
    .retro-shadow { box-shadow: 6px 6px 0px #000; }
    .retro-shadow-sm { box-shadow: 3px 3px 0px #000; }
    .retro-text-shadow { text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }

    @keyframes floatUp {
      0% { transform: translateY(150px) scale(0.5); opacity: 0; }
      15% { opacity: 1; transform: translateY(0) scale(1); }
      85% { opacity: 1; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }
    .bubble-anim { animation: floatUp linear forwards; }

    @keyframes popScore {
      0% { transform: scale(0.5) rotate(-15deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(10deg); opacity: 1; }
      100% { transform: scale(2) translateY(-20px); opacity: 0; }
    }
    .score-pop {
      animation: popScore 0.6s ease-out forwards;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 使用 module 模式來支援 ES6 Imports -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, serverTimestamp } from 'firebase/firestore';

    const { useState, useEffect, useRef, useCallback } = React;

    // ================= 遊戲設定（需與 index.html 一致）=================
    const TOTAL_TABLES = 60;
    const TABLES_PER_ROUND = 10;
    const GAME_DURATION = 30;
    const POINTS_PER_BUBBLE = 10;
    const FLUSH_INTERVAL = 1000;     // 每隔多久把累積分數送回資料庫 (毫秒)
    const SPAWN_INTERVAL = 800;      // 泡泡生成間隔 (毫秒)
    const STORAGE_KEY = 'tsrc_racing_table';

    // ================= Firebase =================
    const firebaseConfig = {
      apiKey: "AIzaSyAVKXL-r-MM2NSs9f6T9LPX70b-CAgCXQY",
      authDomain: "tsrc-racing.firebaseapp.com",
      projectId: "tsrc-racing",
      storageBucket: "tsrc-racing.firebasestorage.app",
      messagingSenderId: "859095220602",
      appId: "1:859095220602:web:70c4d9be106383a97656c3",
      measurementId: "G-1RLXCDE731"
    };
    const APP_ID = 'tsrc-game-default';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const stateRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'game', 'state');
    const playersCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'players');

    // ================= 工具 =================
    const roundTables = (round) => {
      const start = (round - 1) * TABLES_PER_ROUND + 1;
      const end = Math.min(round * TABLES_PER_ROUND, TOTAL_TABLES);
      return Array.from({ length: end - start + 1 }, (_, i) => start + i);
    };
    const roundOfTable = (t) => Math.ceil(t / TABLES_PER_ROUND);
    const getStatus = (game) => {
      if (!game || game.status === 'waiting' || !game.gameId) return 'waiting';
      return game.status;
    };
    const validTable = (v) => (Number.isInteger(v) && v >= 1 && v <= TOTAL_TABLES ? v : null);

    // 桌號來源：網址 ?table=N（QR Code）優先，其次是這支手機上次綁定的桌號
    const getInitialTable = () => {
      const fromUrl = validTable(parseInt(new URLSearchParams(location.search).get('table'), 10));
      if (fromUrl) { try { localStorage.setItem(STORAGE_KEY, fromUrl); } catch (e) {} return fromUrl; }
      try { return validTable(parseInt(localStorage.getItem(STORAGE_KEY), 10)); } catch (e) { return null; }
    };
    const saveTable = (n) => {
      try { n ? localStorage.setItem(STORAGE_KEY, n) : localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      history.replaceState(null, '', n ? `${location.pathname}?table=${n}` : location.pathname);
    };

    // ================= UI 元件 =================
    const TrophyIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="#facc15" stroke="#000" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
    );

    const Overlay = ({ color = 'bg-[#38bdf8]', rotate = 'rotate-1', children }) => (
      <div className="absolute inset-0 flex items-center justify-center p-6 bg-black/50 backdrop-blur-sm z-40">
        <div className={`${color} border-4 border-black retro-shadow p-6 text-center transform ${rotate} w-full max-w-sm`}>
          {children}
        </div>
      </div>
    );

    const BUBBLE_TYPES = [
      { text: '低滾動阻力', color: 'bg-[#38bdf8]' },
      { text: '耐磨', color: 'bg-[#f472b6]' },
      { text: '濕地抓地力', color: 'bg-[#22c55e]' },
    ];

    const MobileApp = () => {
      const [user, setUser] = useState(null);
      const [table, setTable] = useState(getInitialTable);
      const [inputVal, setInputVal] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [game, setGame] = useState(null);
      const [score, setScore] = useState(0);
      const [timeLeft, setTimeLeft] = useState(GAME_DURATION);
      const [bubbles, setBubbles] = useState([]);
      const [pops, setPops] = useState([]);

      const scoreRef = useRef(0);       // 本場個人累積分數
      const lastSentRef = useRef(-1);   // 上次送出的分數（沒變就不送，省用量）
      const gameIdRef = useRef(null);
      const idRef = useRef(0);

      const status = getStatus(game);
      const round = game?.round || 1;
      const gameId = status === 'waiting' ? null : game.gameId;
      const currentTables = roundTables(round);
      const inRound = !!table && currentTables.includes(table);
      const isPlaying = status === 'playing' && inRound;

      // 1. 匿名登入
      useEffect(() => {
        signInAnonymously(auth).catch(err => console.error('匿名登入失敗', err));
        return onAuthStateChanged(auth, setUser);
      }, []);

      // 2. 只監聽遊戲狀態（不監聽別人的分數，大幅減少讀取量）
      useEffect(() => {
        if (!user) return;
        return onSnapshot(stateRef,
          snap => setGame(snap.exists() ? snap.data() : null),
          err => console.error('Firebase 監聽失敗', err)
        );
      }, [user]);

      // 3. 換新的一場 → 個人分數歸零；若是比賽中重新整理，接回先前的分數
      useEffect(() => {
        gameIdRef.current = gameId;
        scoreRef.current = 0;
        lastSentRef.current = -1;
        setScore(0);
        if (!gameId || !user) return;
        let cancelled = false;
        getDoc(doc(playersCol, user.uid)).then(snap => {
          const d = snap.data();
          if (cancelled || !d || d.gameId !== gameId || !d.score) return;
          scoreRef.current += d.score;
          setScore(scoreRef.current);
        }).catch(() => {});
        return () => { cancelled = true; };
      }, [gameId, user]);

      // 4. 把累積分數定時送回（每支手機只寫自己的文件，不會互相塞車）
      const flush = useCallback(() => {
        const gid = gameIdRef.current;
        if (!user || !table || !gid) return;
        const s = scoreRef.current;
        if (s === lastSentRef.current) return;
        lastSentRef.current = s;
        setDoc(doc(playersCol, user.uid), { gameId: gid, table, score: s, updatedAt: serverTimestamp() })
          .catch(err => { console.error('分數回傳失敗', err); lastSentRef.current = -1; });
      }, [user, table]);

      useEffect(() => {
        if (!isPlaying) return;
        flush(); // 開賽立即報到（0 分也送，大螢幕可顯示各桌人數）
        const t = setInterval(flush, FLUSH_INTERVAL);
        return () => { clearInterval(t); flush(); }; // 結束時補送最後一次
      }, [isPlaying, flush]);

      // 5. 手機端倒數顯示
      useEffect(() => {
        if (!isPlaying) return;
        const duration = game.duration || GAME_DURATION;
        const start = Date.now();
        const tick = () => setTimeLeft(Math.max(0, Math.ceil(duration - (Date.now() - start) / 1000)));
        tick();
        const t = setInterval(tick, 250);
        return () => clearInterval(t);
      }, [isPlaying, gameId]);

      // 6. 泡泡生成
      useEffect(() => {
        if (!isPlaying) { setBubbles([]); return; }
        const timers = [];
        const spawnBubble = () => {
          const type = BUBBLE_TYPES[Math.floor(Math.random() * BUBBLE_TYPES.length)];
          const id = ++idRef.current;
          const left = 5 + Math.random() * 65;
          const duration = 4 + Math.random() * 2;
          setBubbles(prev => [...prev, { id, ...type, left, duration }]);
          timers.push(setTimeout(() => setBubbles(prev => prev.filter(b => b.id !== id)), duration * 1000));
        };
        spawnBubble();
        const interval = setInterval(spawnBubble, SPAWN_INTERVAL);
        return () => { clearInterval(interval); timers.forEach(clearTimeout); };
      }, [isPlaying]);

      // 7. 戳泡泡（用 pointerdown，按下瞬間就算，移動中的泡泡也點得到）
      const handlePop = (e, bubble) => {
        e.preventDefault();
        e.stopPropagation();
        if (!isPlaying) return;
        if (navigator.vibrate) navigator.vibrate(30);
        scoreRef.current += POINTS_PER_BUBBLE;
        setScore(scoreRef.current);
        const rect = e.currentTarget.getBoundingClientRect();
        const popId = ++idRef.current;
        setPops(prev => [...prev, { id: popId, x: rect.left + rect.width / 2, y: rect.top }]);
        setBubbles(prev => prev.filter(b => b.id !== bubble.id));
        setTimeout(() => setPops(prev => prev.filter(p => p.id !== popId)), 600);
      };

      const bindTable = () => {
        const n = validTable(parseInt(inputVal, 10));
        if (!n) { setErrorMsg(`⚠️ 桌次僅限 1~${TOTAL_TABLES}`); return; }
        setTable(n);
        saveTable(n);
        setErrorMsg('');
      };
      const unbindTable = () => {
        setTable(null);
        setInputVal('');
        saveTable(null);
      };

      const rangeText = (r) => { const t = roundTables(r); return `第 ${t[0]}–${t[t.length - 1]} 桌`; };
      const winners = game?.winners || [];
      const finalScores = game?.finalScores || {};

      return (
        <div className="w-full h-[100dvh] bg-[#1e3a8a] flex flex-col relative overflow-hidden">
          <div className="absolute inset-0 bg-grid z-0 pointer-events-none"></div>

          {/* 頂部導覽列 */}
          <div className="w-full bg-white border-b-4 border-black p-3 flex justify-between items-center z-20 shrink-0 relative">
            <div className="flex gap-2">
              <div className="w-4 h-4 rounded-full bg-[#e11d48] border-2 border-black"></div>
              <div className="w-4 h-4 rounded-full bg-[#facc15] border-2 border-black"></div>
              <div className="w-4 h-4 rounded-full bg-[#22c55e] border-2 border-black"></div>
            </div>
            <span className="font-black text-black text-lg tracking-wider font-['Righteous'] uppercase">Player_UI.exe</span>
            <div className="w-10">
              <div className={`w-3 h-3 rounded-full border-2 border-black ml-auto ${user ? 'bg-green-500' : 'bg-red-500'}`}></div>
            </div>
          </div>

          {/* 狀態列 */}
          <div className="p-4 z-20 shrink-0 relative">
            <div className="bg-[#facc15] border-4 border-black retro-shadow p-3 flex justify-between items-center transform -rotate-1 relative">
              <div className="bg-white border-4 border-black px-3 py-1">
                <span className="font-black text-xl">{table ? `第 ${table} 桌` : '未綁定'}</span>
              </div>
              {isPlaying && (
                <div className={`border-4 border-black px-3 py-1 font-black text-2xl font-mono ${timeLeft <= 5 ? 'bg-[#e11d48] text-white animate-pulse' : 'bg-black text-[#facc15]'}`}>
                  {timeLeft}s
                </div>
              )}
              <div className="text-right">
                <div className="font-black text-sm mb-1 font-['Righteous']">MY SCORE</div>
                <div className="bg-white border-4 border-black rounded-full px-4 py-1 inline-block">
                  <span className="font-black text-2xl italic">{score}</span>
                </div>
              </div>
            </div>
          </div>

          {/* 遊戲互動區 */}
          <div className="flex-1 relative z-10 touch-none">

            {/* 綁定桌次 */}
            {!table && (
              <div className="absolute inset-0 flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm z-50">
                <div className="bg-[#f472b6] border-4 border-black retro-shadow p-6 text-center transform -rotate-2 w-full max-w-sm">
                  <h2 className="text-3xl font-black text-white mb-6 retro-text-shadow tracking-widest">綁定所屬車隊</h2>
                  <div className="bg-[#38bdf8] border-4 border-black p-4 mb-4 retro-shadow-sm">
                    <label className="block text-black font-black mb-3 text-lg">請輸入桌次號碼 (1-{TOTAL_TABLES})：</label>
                    <input type="number" inputMode="numeric" pattern="\d*" min="1" max={TOTAL_TABLES} value={inputVal}
                      onChange={(e) => { setInputVal(e.target.value); setErrorMsg(''); }}
                      onKeyDown={(e) => { if (e.key === 'Enter') bindTable(); }}
                      className="w-full text-center text-6xl font-black italic p-2 border-4 border-black bg-white focus:outline-none focus:bg-[#facc15] transition-colors select-text" />
                  </div>
                  {errorMsg && <p className="text-black font-black mb-4 bg-white border-2 border-black inline-block px-3 py-1">{errorMsg}</p>}
                  <button onClick={bindTable} className="w-full bg-[#22c55e] text-white border-4 border-black rounded-full py-4 font-black text-2xl flex items-center justify-center gap-2 retro-shadow active:translate-y-[6px] active:shadow-none transition-all">
                    確認綁定
                  </button>
                </div>
              </div>
            )}

            {/* 等待開始 */}
            {table && status === 'waiting' && (
              <Overlay>
                <div className="bg-white border-4 border-black rounded-full w-24 h-24 mx-auto flex items-center justify-center mb-4 retro-shadow-sm">
                  <TrophyIcon />
                </div>
                <h2 className="text-3xl font-black text-white mb-2 retro-text-shadow">賽車手集結！</h2>
                <div className="h-1 bg-black w-full my-4"></div>
                {inRound ? (
                  <p className="font-black text-black text-xl mb-4 animate-pulse">下一場就是你！<br />等待大螢幕指示開始...</p>
                ) : (
                  <p className="font-black text-black text-lg mb-4">
                    準備中：第 {round} 梯次（{rangeText(round)}）<br />
                    你的車隊在 <span className="text-white retro-text-shadow text-2xl">第 {roundOfTable(table)} 梯次</span>，請稍候
                  </p>
                )}
                <button onClick={unbindTable} className="text-sm font-bold text-black underline">桌號綁錯了？重新綁定</button>
              </Overlay>
            )}

            {/* 其他梯次比賽中 */}
            {table && status !== 'waiting' && !inRound && (
              <Overlay color="bg-white" rotate="-rotate-1">
                <h2 className="text-2xl font-black text-black mb-3">🏁 第 {round} 梯次比賽中</h2>
                <p className="font-black text-black text-lg mb-2">（{rangeText(round)}）</p>
                <div className="h-1 bg-black w-full my-4"></div>
                <p className="font-black text-black text-lg">你的車隊在第 {roundOfTable(table)} 梯次<br />先看大螢幕幫大家加油吧！</p>
              </Overlay>
            )}

            {/* 時間到 */}
            {inRound && status === 'judging' && (
              <Overlay color="bg-[#e11d48]" rotate="-rotate-2">
                <h2 className="text-5xl font-black italic text-white retro-text-shadow mb-3">TIME UP!</h2>
                <p className="font-black text-white text-xl animate-pulse">計算成績中，請看大螢幕...</p>
              </Overlay>
            )}

            {/* 本場結果 */}
            {inRound && status === 'finished' && (
              winners.includes(table) ? (
                <Overlay color="bg-[#facc15]" rotate="rotate-2">
                  <div className="flex justify-center mb-3"><TrophyIcon /></div>
                  <h2 className="text-4xl font-black italic text-white retro-text-shadow mb-3">恭喜奪冠！</h2>
                  <p className="font-black text-black text-lg bg-[#22c55e] border-4 border-black py-2 px-3 mb-4">跑出命定奪冠路線！<br />率先取得 2027 產線認證！</p>
                  <p className="font-black text-black">本桌總分 {finalScores[table] || 0}・你貢獻了 {score} 分</p>
                </Overlay>
              ) : (
                <Overlay color="bg-[#38bdf8]" rotate="-rotate-1">
                  <h2 className="text-3xl font-black text-white retro-text-shadow mb-3">比賽結束！</h2>
                  <p className="font-black text-black text-xl mb-3">
                    {winners.length ? `本場冠軍：第 ${winners.join('、')} 桌` : '本場無人得分'}
                  </p>
                  <div className="h-1 bg-black w-full my-3"></div>
                  <p className="font-black text-black">本桌總分 {finalScores[table] || 0}・你貢獻了 {score} 分</p>
                </Overlay>
              )
            )}

            {/* 泡泡 */}
            {bubbles.map(bubble => (
              <div key={bubble.id} onPointerDown={(e) => handlePop(e, bubble)} className={`absolute bottom-0 w-24 h-24 ${bubble.color} border-4 border-black rounded-full flex items-center justify-center p-2 cursor-pointer shadow-[inset_-4px_-4px_0px_rgba(0,0,0,0.2)] retro-shadow-sm bubble-anim`} style={{ left: `${bubble.left}%`, animationDuration: `${bubble.duration}s` }}>
                <span className="font-black text-black text-center text-sm leading-tight pointer-events-none">{bubble.text}</span>
                <div className="absolute top-2 left-2 w-4 h-4 bg-white rounded-full opacity-60 pointer-events-none"></div>
              </div>
            ))}

            {/* 點擊特效（fixed，位置對準被戳的泡泡）*/}
            {pops.map(pop => (
              <div key={pop.id} className="fixed z-50 pointer-events-none score-pop" style={{ left: pop.x - 20, top: pop.y - 20 }}>
                <span className="text-3xl font-black italic text-[#facc15]">+{POINTS_PER_BUBBLE}</span>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MobileApp />);
  </script>
</body>
</html>
